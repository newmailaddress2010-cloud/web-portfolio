<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>つながりラウンジ（仮）｜利用意向アンケート</title>
  <meta name="description" content="新しい出会い・友達づくりサービスの需要調査アンケートです。">
  <style>
    :root { color-scheme: light; --ink:#243047; --muted:#5f6b7c; --accent:#6b63c8; --paper:#ffffff; --bg:#f4f5fb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); line-height:1.8; }
    main { width:min(760px, calc(100% - 32px)); margin:48px auto; }
    .panel { background:var(--paper); border-radius:24px; padding:clamp(24px, 6vw, 52px); box-shadow:0 12px 36px rgba(37,44,80,.08); }
    .eyebrow { color:var(--accent); font-weight:700; letter-spacing:.08em; font-size:.85rem; }
    h1 { font-size:clamp(2rem, 6vw, 3rem); line-height:1.25; margin:12px 0 20px; }
    p { margin:12px 0; }
    .lead { font-size:1.08rem; color:#455168; }
    .points { padding-left:1.3em; margin:24px 0; }
    .points li { margin:8px 0; }
    .cta { display:inline-block; width:100%; text-align:center; background:var(--accent); color:#fff; text-decoration:none; font-weight:700; border-radius:14px; padding:16px 20px; margin:14px 0 8px; }
    .cta:hover { filter:brightness(.94); }
    .note { font-size:.9rem; color:var(--muted); }
    footer { text-align:center; font-size:.82rem; color:var(--muted); margin:22px 0; }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <div class="eyebrow">サービス開発に向けた需要調査</div>
      <h1>つながりラウンジ<span style="font-size:.48em; font-weight:500;">（仮）</span></h1>
      <p class="lead">恋人探しや友達づくりを、もっと気軽に。新しいマッチングサービスの可能性を調べています。</p>
      <p>現在は企画段階です。どんな出会いを求めているか、利用してみたいと思うかなど、皆さまのご意見をお聞かせください。</p>
      <ul class="points">
        <li>回答時間の目安：約1〜2分</li>
        <li>氏名・電話番号・住所は尋ねません</li>
        <li>回答は任意です。個人を特定できる情報は入力しないでください</li>
      </ul>
      <a class="cta" href="https://docs.google.com/forms/d/e/1FAIpQLSfKLn0q2MC0RJI3mHRNP0yIvKicfivY28OJ7QKdk8Bl_h35zw/viewform" target="_blank" rel="noopener noreferrer">アンケートに回答する</a>
      <p class="note">※このページは需要調査用です。現時点で会員登録や実際のマッチングを提供するものではありません。</p>
    </section>
    <footer>つながりラウンジ（仮）｜サービス企画・需要調査</footer>
  </main>
</body>
</html>
