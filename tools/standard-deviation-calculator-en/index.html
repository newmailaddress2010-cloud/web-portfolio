<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculate mean, variance, and standard deviation from a list of numbers.</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#1f2937}.wrap{max-width:620px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}h1{font-size:24px}.lead{color:#64748b;line-height:1.6}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}.result{margin-top:18px;padding:18px;background:#f8fafc;border-radius:12px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5e7eb}.err{color:#dc2626;margin-top:10px}</style></head><body><div class="wrap"><div class="card"><h1>Calculate mean, variance, and standard deviation from a list of numbers.</h1><p class="lead">数値</p><div class="field"><label>Numbers (comma-separated)</label><textarea id="a" rows="5" placeholder="10, 20, 30, 40"></textarea></div><button onclick="calc()">Calculate</button><div id="err" class="err"></div><div id="res" class="result" hidden></div></div></div><script>const a=document.getElementById('a'),res=document.getElementById('res'),err=document.getElementById('err');function calc(){let v=a.value.split(',').map(Number).filter(Number.isFinite);if(!v.length){err.textContent='Enter numbers separated by commas.';return}let m=v.reduce((x,y)=>x+y,0)/v.length,va=v.reduce((x,y)=>x+(y-m)**2,0)/v.length;res.innerHTML='<div class="row"><span>Mean</span><strong>'+m.toLocaleString()+'</strong></div><div class="row"><span>Variance</span><strong>'+va.toLocaleString()+'</strong></div><div class="row"><span>Standard Deviation</span><strong>'+Math.sqrt(va).toLocaleString()+'</strong></div>';res.hidden=false}</script></body></html>
