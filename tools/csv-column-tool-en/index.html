<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Column Tool</title><style>body{font-family:Arial;background:#f5f5f5;margin:0}.box{max-width:700px;margin:40px auto;padding:24px;background:white;border-radius:14px}textarea,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px}textarea{height:220px}button{background:#333;color:white;border:0;border-radius:8px}</style><div class="box"><h1>CSV Column Tool</h1><p>Extract or remove columns from CSV data.</p><textarea id="t" placeholder="Paste CSV here"></textarea><input id="c" placeholder="Column numbers, e.g. 1,3"><button onclick="run()">Extract Columns</button><button onclick="removeCols()">Remove Columns</button><textarea id="o" placeholder="Result"></textarea></div><script>function rows(){return document.getElementById("t").value.split(/\r?\n/).filter(x=>x!=="").map(x=>x.split(","))}function cols(){return document.getElementById("c").value.split(",").map(x=>Number(x.trim())-1).filter(x=>x>=0)}function run(){let a=rows(),c=cols();o.value=a.map(r=>c.map(i=>r[i]??"").join(",")).join("\n")}function removeCols(){let a=rows(),c=new Set(cols());o.value=a.map(r=>r.filter((_,i)=>!c.has(i)).join(",")).join("\n")}</script>
