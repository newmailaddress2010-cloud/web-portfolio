<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Line Prefix & Suffix Tool</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:700px;margin:40px auto;padding:24px;background:#fff;border-radius:14px}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px}textarea{height:220px}button{background:#333;color:#fff;border:0;border-radius:8px}</style><div class="box"><h1>Line Prefix & Suffix Tool</h1><input id="p" placeholder="Prefix"><input id="s" placeholder="Suffix"><textarea id="i" placeholder="Paste text here"></textarea><button onclick="go()">Apply</button><textarea id="o"></textarea></div><script>function go(){o.value=i.value.split(/\r?\n/).map(x=>p.value+x+s.value).join('\n')}</script>
