<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>欠勤控除計算機</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:27px}label{display:block;margin:18px 0 8px;font-weight:bold}input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px;text-align:center}.main{font-size:28px;font-weight:bold}.row{display:flex;justify-content:space-between;margin:10px 0}.hint{font-size:13px;color:#666;margin-top:12px}</style></head>
<body><div class="box"><h1>欠勤控除計算機</h1><label>月給（円）</label><input id="salary" type="number" min="0" placeholder="例：250000"><label>その月の所定労働日数</label><input id="workdays" type="number" min="1" placeholder="例：20"><label>欠勤日数</label><input id="absence" type="number" min="0" step="0.5" placeholder="例：2"><button onclick="calc()">計算する</button><div class="result"><div class="main" id="pay">---</div><div class="row"><span>1日あたり</span><span id="daily">---</span></div><div class="row"><span>欠勤控除額</span><span id="deduct">---</span></div></div><div class="hint">※実際の控除方法は就業規則や給与計算の方式によって異なります。</div></div>
<script>function calc(){const s=Number(document.getElementById("salary").value),w=Number(document.getElementById("workdays").value),a=Number(document.getElementById("absence").value);if(!s||!w||a<0||a>w){alert("数値を正しく入力してください。");return}const daily=s/w,d=Math.round(daily*a),p=s-d;document.getElementById("pay").textContent=p.toLocaleString()+"円";document.getElementById("daily").textContent=Math.round(daily).toLocaleString()+"円";document.getElementById("deduct").textContent=d.toLocaleString()+"円"}</script></body></html>
