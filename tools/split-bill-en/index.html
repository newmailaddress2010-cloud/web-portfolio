<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill Split Calculator</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px}label{display:block;margin-top:16px;font-weight:bold}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:6px}button{margin-top:20px;background:#333;color:#fff;border:0;border-radius:8px}</style><div class="box"><h1>Bill Split Calculator</h1><label>Total Bill</label><input id="b" type="number"><label>Number of People</label><input id="n" type="number" value="2"><button onclick="go()">Split the Bill</button><h2 id="r">—</h2></div><script>function go(){r.textContent=(+b.value/+n.value).toLocaleString(undefined,{maximumFractionDigits:0})+' per person'}</script>
