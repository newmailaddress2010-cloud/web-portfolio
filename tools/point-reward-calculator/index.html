<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="購入金額とポイント還元率から獲得ポイントと実質負担額を計算できる無料ツールです。">
<title>ポイント還元率計算機</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:28px;margin:0 0 8px}.lead{text-align:center;color:#666;margin:0 0 24px}label{display:block;margin:18px 0 8px;font-weight:bold}input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px}.main{font-size:30px;font-weight:bold;text-align:center;margin:8px 0 18px}.row{display:flex;justify-content:space-between;gap:12px;margin:12px 0}.value{font-weight:bold}.note{font-size:13px;color:#666;line-height:1.6;margin-top:18px}@media(max-width:600px){.box{margin:16px;padding:22px}.main{font-size:27px}}</style></head>
<body><div class="box"><h1>ポイント還元率計算機</h1><p class="lead">獲得ポイントと実質負担額を計算</p>
<label>購入金額（円）</label><input id="price" type="number" min="0" placeholder="例：10000">
<label>ポイント還元率（%）</label><input id="rate" type="number" min="0" step="0.01" placeholder="例：1">
<button onclick="calc()">計算する</button>
<div class="result"><div class="main" id="points">---</div><div class="row"><span>獲得ポイント相当額</span><span class="value" id="reward">---</span></div><div class="row"><span>実質負担額</span><span class="value" id="net">---</span></div></div>
<p class="note">ポイントを1ポイント＝1円相当として計算します。実際の付与条件や端数処理はサービスによって異なります。</p></div>
<script>function yen(n){return Math.round(n).toLocaleString()+"円"}function calc(){const p=Number(document.getElementById("price").value),r=Number(document.getElementById("rate").value);if(!Number.isFinite(p)||p<0||!Number.isFinite(r)||r<0){alert("購入金額と還元率を正しく入力してください。");return}const reward=p*r/100,net=p-reward;document.getElementById("points").textContent=reward.toLocaleString(undefined,{maximumFractionDigits:2})+"ポイント";document.getElementById("reward").textContent=yen(reward);document.getElementById("net").textContent=yen(net)}</script></body></html>
