<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="断る・お願いする・返信する文章を状況別にすぐ作れる短文メーカー。">
<title>返信・文章メーカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<header>
<p class="eyebrow">SHORT MESSAGE TOOL</p>
<h1>返信・文章メーカー</h1>
<p class="lead">「なんて書けばいい？」を、短く自然な文章にします。</p>
</header>

<section class="card">
<label for="situation">何の文章？</label>
<select id="situation">
<option value="decline">誘い・申し出を断る</option>
<option value="request">お願い・依頼をする</option>
<option value="reschedule">日程変更をお願いする</option>
<option value="apology">謝る・返信が遅れた</option>
<option value="thanks">お礼を伝える</option>
<option value="participation">参加を断る</option>
<option value="other">その他</option>
</select>

<label for="relationship">相手との関係</label>
<select id="relationship">
<option value="friend">友人・知人</option>
<option value="work">職場・仕事関係</option>
<option value="family">家族・親族</option>
<option value="customer">お客様・取引先</option>
<option value="acquaintance">あまり親しくない相手</option>
</select>

<label for="tone">文章の雰囲気</label>
<select id="tone">
<option value="soft">やわらかく</option>
<option value="simple">簡潔に</option>
<option value="polite">丁寧に</option>
</select>

<label for="reason">伝えたいこと・理由（任意）</label>
<textarea id="reason" rows="4" placeholder="例：今回は予定が合わないため"></textarea>

<button id="makeBtn">文章を作る</button>
</section>

<section class="card result-card" id="resultCard" hidden>
<div class="result-head">
<h2>できあがり</h2>
<button id="copyBtn" class="sub-btn">コピー</button>
</div>
<textarea id="result" rows="7" readonly></textarea>
<p class="note">※理由を入力しなかった場合、理由を勝手に作らない文章になります。</p>
<button id="resetBtn" class="text-btn">最初からやり直す</button>
</section>

<section class="card history-card" id="historyCard" hidden>
<h2>最近作った文章</h2>
<div id="history"></div>
</section>

<footer>
<p>入力内容と履歴はこのブラウザ内に保存され、外部へ送信されません。</p>
<p><a href="../">ツール一覧へ</a></p>
</footer>
</main>
<script src="script.js"></script>
</body>
</html>
