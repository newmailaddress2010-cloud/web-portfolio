<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>フリーランス単価計算機｜必要な時給を逆算</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:0 auto;padding:20px;background:#f6f7f9;color:#222;line-height:1.6}
main{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 12px #0001}
h1{font-size:24px;margin-top:0} .lead{color:#555}
label{display:block;margin-top:16px;font-weight:600} input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{margin-top:20px;padding:12px 18px;border:0;border-radius:8px;background:#333;color:#fff;font-size:16px;cursor:pointer}
.result{margin-top:22px;padding:18px;background:#f0f3f6;border-radius:10px}
.big{font-size:28px;font-weight:700} .note{font-size:13px;color:#666;margin-top:16px}
</style>
</head>
<body><main>
<h1>フリーランス単価計算機</h1>
<p class="lead">目標年収・経費・年間の稼働時間から、必要な最低時給と月間売上を逆算します。</p>
<label>目標年収（円）<input id="income" type="number" min="0" value="3000000"></label>
<label>年間経費（円）<input id="expense" type="number" min="0" value="300000"></label>
<label>年間の請求可能時間（時間）<input id="hours" type="number" min="1" value="1200"></label>
<label>税金などの予備率（%）<input id="tax" type="number" min="0" max="90" step="0.1" value="15"></label>
<button onclick="calc()">計算する</button>
<div id="result" class="result"></div>
<p class="note">概算です。目標年収は税引前の自分の収入として計算しています。税金・社会保険料、実際の経費、休業期間、営業・事務時間などは個人の状況によって異なります。</p>
</main>
<script>
function n(id){return Number(document.getElementById(id).value)||0}
function yen(x){return Math.round(x).toLocaleString("ja-JP")+"円"}
function calc(){
 const income=n("income"),expense=n("expense"),hours=n("hours"),tax=n("tax")/100;
 if(hours<=0||tax>=1){document.getElementById("result").textContent="入力値を確認してください。";return}
 const base=income+expense;
 const reserve=base*tax;
 const revenue=base+reserve;
 const hourly=revenue/hours;
 document.getElementById("result").innerHTML=
 "<div>必要な年間売上</div><div class='big'>"+yen(revenue)+"</div>"+
 "<div>必要な月間売上：約 "+yen(revenue/12)+"</div>"+
 "<div>必要な最低時給：約 "+yen(hourly)+"</div>"+
 "<div>税金などの予備分：約 "+yen(reserve)+"</div>";
}
calc();
</script></body></html>
