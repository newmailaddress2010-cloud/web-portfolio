<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>時間計算機</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:28px}.row{display:flex;gap:14px}.field{flex:1}label{display:block;margin:18px 0 8px;font-weight:bold}input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px;text-align:center}.result strong{font-size:30px}@media(max-width:500px){.box{margin:20px 12px}.row{gap:8px}}
</style></head><body><div class="box"><h1>時間計算機</h1><div class="row"><div class="field"><label>開始時刻</label><input id="start" type="time" value="09:00"></div><div class="field"><label>終了時刻</label><input id="end" type="time" value="17:00"></div></div><button onclick="calc()">計算する</button><div class="result"><p>経過時間</p><strong id="result">---</strong><p id="minutes"></p></div></div>
<script>function calc(){const s=document.getElementById("start").value,e=document.getElementById("end").value;if(!s||!e){alert("時刻を入力してください。");return}const [sh,sm]=s.split(":").map(Number),[eh,em]=e.split(":").map(Number);let a=sh*60+sm,b=eh*60+em;if(b<a)b+=1440;const d=b-a;document.getElementById("result").textContent=Math.floor(d/60)+"時間"+d%60+"分";document.getElementById("minutes").textContent="合計 "+d+"分"}</script></body></html>
