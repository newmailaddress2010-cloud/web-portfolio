<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業務引き継ぎシートメーカー | Small Biz Web Studio</title><meta name="description" content="業務の手順や担当者、頻度、注意点を整理して、引き継ぎ用の文章を作れる無料ツールです。"><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.7;margin:0;background:#f6f7f9;color:#222}main{max-width:820px;margin:0 auto;padding:24px 16px 50px}h1{font-size:25px;margin:0 0 8px}.lead{color:#666;margin:0 0 22px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:16px}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:7px;font:inherit}textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #ddd;border-radius:9px;padding:14px;margin:12px 0;background:#fafafa}button{border:0;border-radius:7px;padding:10px 15px;font:inherit;cursor:pointer;margin:5px 5px 0 0}button.primary{background:#222;color:#fff}button.sub{background:#eee}.remove{float:right;background:#eee;padding:5px 9px}#output{white-space:pre-wrap;background:#fafafa;border:1px solid #ddd;border-radius:8px;padding:14px;min-height:160px}.small{font-size:13px;color:#777}@media(max-width:600px){.row{grid-template-columns:1fr}h1{font-size:22px}}</style></head><body><main><h1>業務引き継ぎシートメーカー</h1><p class="lead">「この仕事、どうやるんだっけ？」を防ぐために、業務の手順・頻度・担当・注意点を整理できます。</p><div class="card"><label for="company">会社・事業名</label><input id="company" placeholder="例：○○商店"><label for="title">引き継ぐ業務名</label><input id="title" placeholder="例：毎月の請求書作成"><label for="person">現在の担当者</label><input id="person" placeholder="例：山田"><label for="newperson">引き継ぎ先</label><input id="newperson" placeholder="例：佐藤"><label for="note">業務の目的・概要</label><textarea id="note" placeholder="この業務で何をするのか、簡単に書いてください"></textarea></div><div class="card"><h2>業務手順</h2><div id="items"></div><button class="sub" onclick="addItem()">＋ 手順を追加</button><p class="small">作業の順番、使うサービス、確認ポイントなどを1項目ずつ登録できます。</p></div><div class="card"><label for="frequency">実施頻度</label><select id="frequency"><option>毎日</option><option>毎週</option><option>毎月</option><option>必要なとき</option><option>その他</option></select><label for="contact">問い合わせ先・関連連絡先</label><textarea id="contact" placeholder="担当者名、メール、社内連絡先など"></textarea><label for="caution">注意点・トラブル時の対応</label><textarea id="caution" placeholder="よくあるミス、困ったときの確認先など"></textarea><label for="deadline">引き継ぎ後の確認事項</label><textarea id="deadline" placeholder="初回は○月○日までに確認、など"></textarea></div><div class="card"><button class="primary" onclick="makeSheet()">引き継ぎシートを作る</button><button class="sub" onclick="copyText()">文章をコピー</button><button class="sub" onclick="clearAll()">入力をクリア</button><div id="output">ここに引き継ぎシートが表示されます。</div></div></main><script>const items=document.getElementById("items");function addItem(){const n=items.children.length+1;const d=document.createElement("div");d.className="item";d.innerHTML="<button class=\"remove\" onclick=\"this.parentElement.remove()\">削除</button><strong>手順 "+n+"</strong><div class=\"row\"><div><label>作業内容</label><input class=\"step\" placeholder=\"例：前月の売上データを確認\"></div><div><label>使用するもの・場所</label><input class=\"tool\" placeholder=\"例：会計ソフト\"></div></div><label>注意・確認ポイント</label><textarea class=\"check\" placeholder=\"例：税込金額になっているか確認\"></textarea>";items.appendChild(d)}addItem();function val(id){return document.getElementById(id).value.trim()}function makeSheet(){const rows=["【業務引き継ぎシート】","会社・事業名："+(val("company")||"未記入"),"業務名："+(val("title")||"未記入"),"現在の担当者："+(val("person")||"未記入"),"引き継ぎ先："+(val("newperson")||"未記入"),"","■ 業務の目的・概要"," "+(val("note")||"未記入"),"","■ 業務手順"];[...items.children].forEach((el,i)=>{const s=el.querySelector(".step").value.trim(),t=el.querySelector(".tool").value.trim(),c=el.querySelector(".check").value.trim();rows.push((i+1)+". "+(s||"未記入"));if(t)rows.push("   使用するもの・場所："+t);if(c)rows.push("   注意・確認："+c)});rows.push("","■ 実施頻度"," "+val("frequency"),"","■ 問い合わせ先・関連連絡先"," "+(val("contact")||"未記入"),"","■ 注意点・トラブル時の対応"," "+(val("caution")||"未記入"),"","■ 引き継ぎ後の確認事項"," "+(val("deadline")||"未記入"));document.getElementById("output").textContent=rows.join("\n")}async function copyText(){makeSheet();try{await navigator.clipboard.writeText(document.getElementById("output").textContent);alert("コピーしました。")}catch(e){alert("コピーできませんでした。表示された文章を選択してコピーしてください。")}}function clearAll(){if(!confirm("入力内容をすべて消しますか？"))return;document.querySelectorAll("input,textarea").forEach(x=>x.value="");document.getElementById("frequency").selectedIndex=0;items.innerHTML="";addItem();document.getElementById("output").textContent="ここに引き継ぎシートが表示されます。"}</script></body></html>
