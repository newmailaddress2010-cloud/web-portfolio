<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>割り勘計算機</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#333}
.container{max-width:500px;margin:60px auto;padding:20px}.box{background:white;padding:30px;border-radius:12px}
h1{text-align:center;margin-bottom:30px}label{display:block;margin-top:15px;margin-bottom:7px;font-weight:bold}
input{width:100%;padding:12px;font-size:18px;border:1px solid #ccc;border-radius:6px}
button{width:100%;margin-top:25px;padding:14px;font-size:16px;border:0;border-radius:6px;background:#333;color:white;cursor:pointer}
.result{margin-top:30px;padding:20px;background:#f5f5f5;border-radius:8px;text-align:center}.amount{font-size:40px;font-weight:bold}
</style>
</head>
<body>
<div class="container"><div class="box">
<h1>割り勘計算機</h1>
<label for="total">合計金額（円）</label><input type="number" id="total" placeholder="10000">
<label for="people">人数</label><input type="number" id="people" placeholder="4">
<button onclick="calculate()">計算する</button>
<div class="result" id="result">1人あたりの金額が表示されます。</div>
</div></div>
<script>
function calculate(){
const total=Number(document.getElementById("total").value);
const people=Number(document.getElementById("people").value);
const result=document.getElementById("result");
if(total<=0||people<=0){result.textContent="金額と人数を入力してください。";return;}
const amount=Math.ceil(total/people);
result.innerHTML='1人あたり<br><span class="amount">'+amount.toLocaleString()+'円</span>';
}
</script>
</body>
</html>
