<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROI（投資利益率）計算機</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fa;color:#222}.wrap{max-width:760px;margin:0 auto;padding:24px 16px 40px}h1{font-size:26px;margin:0 0 8px}.lead{color:#666;margin:0 0 22px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #ccd3dc;border-radius:9px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#333;color:#fff;font-size:16px;font-weight:700;margin-top:18px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.result{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#f3f5f7;border-radius:10px;padding:14px}.box small{display:block;color:#666;margin-bottom:5px}.value{font-size:22px;font-weight:800}.note{font-size:13px;color:#666;line-height:1.7;margin:12px 0 0}@media(max-width:560px){.grid,.result{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>ROI（投資利益率）計算機</h1>
<p class="lead">投資に対して、どれくらい利益が出たかを計算します。</p>
<div class="card">
<div class="grid">
<div><label for="investment">初期投資額</label><input id="investment" type="number" min="0" step="any" placeholder="例：100000"></div>
<div><label for="revenue">得られた売上・収益</label><input id="revenue" type="number" min="0" step="any" placeholder="例：150000"></div>
</div>
<label for="cost">追加コスト</label><input id="cost" type="number" min="0" step="any" placeholder="例：10000">
<label for="period">投資期間（年）</label><input id="period" type="number" min="0" step="any" value="1">
<button onclick="calc()">計算する</button>
</div>
<div class="card">
<div class="result">
<div class="box"><small>利益</small><div class="value" id="profit">—</div></div>
<div class="box"><small>ROI</small><div class="value" id="roi">—</div></div>
<div class="box"><small>総投資額</small><div class="value" id="total">—</div></div>
<div class="box"><small>年率換算リターン</small><div class="value" id="annual">—</div></div>
</div>
<p class="note">ROI ＝ 利益 ÷ 総投資額 × 100。利益は「得られた売上・収益 − 総投資額」です。年率換算は複数年の比較用の目安です。手数料・税金などは入力に含めてください。</p>
</div>
</div>
<script>
function fmt(n){return new Intl.NumberFormat('ja-JP',{maximumFractionDigits:2}).format(n)}
function calc(){
 const i=Number(document.getElementById('investment').value),r=Number(document.getElementById('revenue').value),c=Number(document.getElementById('cost').value)||0,p=Number(document.getElementById('period').value)||1;
 if(i<=0||r<0||c<0){alert('初期投資額は0より大きい数字を入力してください。');return}
 const total=i+c, profit=r-total, roi=profit/total*100;
 let annual='—';
 if(p>0&&r>=0){const ratio=r/total; annual=(ratio>0?(Math.pow(ratio,1/p)-1)*100:-100);}
 document.getElementById('profit').textContent=fmt(profit);
 document.getElementById('roi').textContent=fmt(roi)+'%';
 document.getElementById('total').textContent=fmt(total);
 document.getElementById('annual').textContent=fmt(annual)+'%';
}
</script>
</body></html>
