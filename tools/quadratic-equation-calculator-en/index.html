<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solve ax² + bx + c = 0.</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#1f2937}.wrap{max-width:620px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}h1{font-size:24px}.lead{color:#64748b;line-height:1.6}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}.result{margin-top:18px;padding:18px;background:#f8fafc;border-radius:12px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5e7eb}.err{color:#dc2626;margin-top:10px}</style></head><body><div class="wrap"><div class="card"><h1>Solve ax² + bx + c = 0.</h1><p class="lead">a</p><div class="field"><label>a</label><input id="a" type="number"></div><div class="field"><label>b</label><input id="b" type="number"></div><div class="field"><label>c</label><input id="c" type="number"></div><button onclick="calc()">Calculate</button><div id="err" class="err"></div><div id="res" class="result" hidden></div></div></div><script>const a=document.getElementById('a'),b=document.getElementById('b'),c=document.getElementById('c'),res=document.getElementById('res'),err=document.getElementById('err');function calc(){let A=+a.value,B=+b.value,C=+c.value;if(A===0){err.textContent='a must not be zero.';return}let D=B*B-4*A*C;if(D<0){res.innerHTML='<strong>No real solutions</strong>';res.hidden=false;return}let x1=(-B+Math.sqrt(D))/(2*A),x2=(-B-Math.sqrt(D))/(2*A);res.innerHTML='<div class="row"><span>x₁</span><strong>'+x1+'</strong></div><div class="row"><span>x₂</span><strong>'+x2+'</strong></div>';res.hidden=false}</script></body></html>
