<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分数計算機</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#1f2937}.wrap{max-width:620px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}h1{font-size:24px}.lead{color:#64748b;line-height:1.6}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}.result{margin-top:18px;padding:18px;background:#f8fafc;border-radius:12px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5e7eb}.err{color:#dc2626;margin-top:10px}</style></head><body><div class="wrap"><div class="card"><h1>分数計算機</h1><p class="lead">2つの分数の加減乗除を計算します。</p><div class="field"><label>分子1</label><input id="a" type="number"></div><div class="field"><label>分母1</label><input id="b" type="number"></div><div class="field"><label>分子2</label><input id="c" type="number"></div><div class="field"><label>分母2</label><input id="d" type="number"></div><button onclick="calc()">計算する</button><div id="err" class="err"></div><div id="res" class="result" hidden></div></div></div><script>function calc(){let a=+aEl.value,b=+bEl.value,c=+cEl.value,d=+dEl.value;if(!b||!d){err.textContent='Denominators cannot be zero.';return}let n=a*d+c*b,den=b*d;let g=Math.abs(n),h=Math.abs(den);while(h){let t=g%h;g=h;h=t}n/=g;den/=g;res.innerHTML='<div class="row"><span>Result</span><strong>'+n+'/'+den+'</strong></div>';res.hidden=false}const aEl=document.getElementById('a'),bEl=document.getElementById('b'),cEl=document.getElementById('c'),dEl=document.getElementById('d'),res=document.getElementById('res'),err=document.getElementById('err');</script></body></html>
