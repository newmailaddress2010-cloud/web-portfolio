<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>割引計算機</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:28px}label{display:block;margin:18px 0 8px;font-weight:bold}input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px}.row{display:flex;justify-content:space-between;margin:10px 0}.price{font-size:28px;font-weight:bold;text-align:center;margin-top:12px}</style></head>
<body><div class="box"><h1>割引計算機</h1><label>元の価格（円）</label><input id="price" type="number" min="0" placeholder="例：5000"><label>割引率（%）</label><input id="rate" type="number" min="0" max="100" step="0.1" placeholder="例：20"><button onclick="calc()">計算する</button><div class="result"><div class="price" id="result">---</div><div class="row"><span>割引額</span><span id="discount">---</span></div><div class="row"><span>支払額</span><span id="pay">---</span></div></div></div>
<script>function calc(){const p=Number(document.getElementById("price").value),r=Number(document.getElementById("rate").value);if(!Number.isFinite(p)||p<0||!Number.isFinite(r)||r<0||r>100){alert("価格と割引率を正しく入力してください。");return}const d=p*r/100,q=p-d;document.getElementById("result").textContent=Math.round(q).toLocaleString()+"円";document.getElementById("discount").textContent=Math.round(d).toLocaleString()+"円";document.getElementById("pay").textContent=Math.round(q).toLocaleString()+"円"}</script></body></html>
