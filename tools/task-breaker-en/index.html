<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Breaker</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:650px;margin:40px auto;padding:24px;background:#fff;border-radius:14px}textarea,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px}textarea{height:220px}button{background:#333;color:#fff;border:0;border-radius:8px}</style><div class="box"><h1>Task Breaker</h1><p>Turn a large task into smaller action steps.</p><textarea id="i" placeholder="Describe your task"></textarea><button onclick="go()">Break It Down</button><div id="o"></div></div><script>function go(){let t=i.value.trim();if(!t){o.textContent='Please enter a task.';return}o.innerHTML=['Define the goal','List the materials or information needed','Do the first small action','Complete the remaining steps','Check the result'].map((x,j)=>(j+1)+'. '+x).join('<br>')}</script>
