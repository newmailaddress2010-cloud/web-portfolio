<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace Profit Calculator</title><style>body{font-family:Arial;background:#f6f7f9}.box{max-width:650px;margin:40px auto;padding:24px;background:#fff;border-radius:14px}label{display:block;font-weight:bold;margin-top:14px}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:6px}button{margin-top:18px;background:#333;color:#fff;border:0;border-radius:8px}.r{margin-top:20px;padding:18px;background:#f1f3f5}</style><div class="box"><h1>Marketplace Profit Calculator</h1><p>Calculate profit after fees, shipping, packing, and cost.</p><label>Sale Price</label><input id="p" type="number"><label>Platform Fee (%)</label><input id="f" type="number" value="10"><label>Shipping Cost</label><input id="s" type="number" value="0"><label>Packing Cost</label><input id="b" type="number" value="0"><label>Item Cost</label><input id="c" type="number" value="0"><button onclick="go()">Calculate Profit</button><div id="r" class="r"></div></div><script>function go(){let p=+p.value,f=+document.getElementById('f').value,s=+document.getElementById('s').value,b=+document.getElementById('b').value,c=+document.getElementById('c').value,fee=p*f/100,profit=p-fee-s-b-c;r.innerHTML='Platform fee: '+Math.round(fee).toLocaleString()+'<br><b>Profit: '+Math.round(profit).toLocaleString()+'</b><br>Profit margin: '+(p?profit/p*100:0).toFixed(1)+'%'}</script>
