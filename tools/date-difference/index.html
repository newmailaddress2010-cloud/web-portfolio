<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>日数計算機</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:28px}label{display:block;margin:18px 0 8px;font-weight:bold}input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px;text-align:center}.main{font-size:30px;font-weight:bold}</style></head>
<body><div class="box"><h1>日数計算機</h1><label>開始日</label><input id="start" type="date"><label>終了日</label><input id="end" type="date"><button onclick="calc()">日数を計算</button><div class="result"><div class="main" id="result">---</div><p id="detail">2つの日付を入力してください。</p></div></div>
<script>function calc(){const s=document.getElementById("start").value,e=document.getElementById("end").value;if(!s||!e){alert("開始日と終了日を入力してください。");return}const a=new Date(s+"T00:00:00"),b=new Date(e+"T00:00:00"),days=Math.round(Math.abs(b-a)/86400000);document.getElementById("result").textContent=days+"日";document.getElementById("detail").textContent="両端の日を含める場合："+(days+1)+"日"}</script></body></html>
