<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="元の寸法と拡大・縮小率から、新しい寸法をすぐ計算できる無料ツール。">
<title>拡大・縮小計算機｜寸法を倍率から計算</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">FREE WEB TOOL</p>
    <h1>拡大・縮小計算機</h1>
    <p class="lead">元のサイズと倍率を入力すると、拡大・縮小後の寸法を計算します。</p>
  </header>

  <section class="card">
    <label>元の幅
      <div class="input-row"><input id="width" type="number" min="0" step="any" placeholder="例：30"><span>cm</span></div>
    </label>
    <label>元の高さ
      <div class="input-row"><input id="height" type="number" min="0" step="any" placeholder="例：20"><span>cm</span></div>
    </label>

    <div class="quick">
      <span>倍率</span>
      <button data-rate="0.5">50%</button>
      <button data-rate="0.7">70%</button>
      <button data-rate="0.8">80%</button>
      <button data-rate="1.2">120%</button>
      <button data-rate="1.5">150%</button>
      <button data-rate="2">200%</button>
    </div>

    <label>倍率
      <div class="input-row"><input id="rate" type="number" min="0" step="any" value="100"><span>%</span></div>
    </label>

    <button id="calc" class="primary">計算する</button>
  </section>

  <section id="result" class="card result hidden">
    <h2>計算結果</h2>
    <div class="result-grid">
      <div><span>新しい幅</span><strong id="newWidth">—</strong></div>
      <div><span>新しい高さ</span><strong id="newHeight">—</strong></div>
    </div>
    <p id="summary" class="summary"></p>
    <button id="copy" class="secondary">結果をコピー</button>
  </section>

  <section class="card info">
    <h2>使い方</h2>
    <ol>
      <li>元の幅と高さを入力します。</li>
      <li>50%なら半分、200%なら2倍というように倍率を入力します。</li>
      <li>「計算する」を押すと新しい寸法が表示されます。</li>
    </ol>
    <p>計算式：元の寸法 × 倍率 ÷ 100</p>
    <p>入力した数値はこのブラウザ内だけで計算され、外部へ送信されません。</p>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
