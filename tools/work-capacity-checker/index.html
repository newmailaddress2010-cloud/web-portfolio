<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>仕事の受け入れ上限チェッカー｜今の案件量で新規案件を受けられる？</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:auto;padding:20px;background:#f6f7f9;color:#222;line-height:1.6}
main{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 12px #0001}h1{font-size:24px;margin-top:0}.lead{color:#555}
label{display:block;margin-top:16px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{margin-top:20px;padding:12px 18px;border:0;border-radius:8px;background:#333;color:#fff;font-size:16px}.result{margin-top:22px;padding:18px;background:#f0f3f6;border-radius:10px}
.big{font-size:30px;font-weight:700}.warn{margin-top:12px;font-weight:600}.ok{margin-top:12px;font-weight:600}.note{font-size:13px;color:#666;margin-top:16px}
</style></head><body><main>
<h1>仕事の受け入れ上限チェッカー</h1>
<p class="lead">今抱えている仕事に新しい案件を追加しても、作業時間と予備時間に収まるかを確認します。</p>
<label>1日に仕事に使える時間（時間）<input id="daily" type="number" min="0.1" step="0.5" value="6"></label>
<label>計画する日数<input id="days" type="number" min="1" step="1" value="5"></label>
<label>現在の案件の残り作業時間（時間）<input id="current" type="number" min="0" step="0.5" value="18"></label>
<label>新規案件の作業時間（時間）<input id="newwork" type="number" min="0" step="0.5" value="8"></label>
<label>連絡・打ち合わせ時間（時間）<input id="communication" type="number" min="0" step="0.5" value="3"></label>
<label>修正・確認時間（時間）<input id="revision" type="number" min="0" step="0.5" value="3"></label>
<label>確保したい予備時間（%）<input id="buffer" type="number" min="0" step="5" value="20"></label>
<button onclick="calc()">受け入れ可能か確認</button>
<div id="result" class="result"></div>
<p class="note">作業時間は見積もり値です。急な依頼、体調、割り込み作業などは反映されないため、実際の納期判断では余裕を持ってください。</p>
</main>
<script>
function n(id){return Number(document.getElementById(id).value)||0}
function fmt(x){return x.toLocaleString("ja-JP",{maximumFractionDigits:1})}
function calc(){
 const daily=n("daily"),days=Math.floor(n("days")),current=n("current"),nw=n("newwork"),com=n("communication"),rev=n("revision"),buf=n("buffer"),r=document.getElementById("result");
 if(daily<=0||days<1||current<0||nw<0||com<0||rev<0||buf<0){r.textContent="入力値を確認してください。";return}
 const capacity=daily*days;
 const work=current+nw+com+rev;
 const required=work*(1+buf/100);
 const free=capacity-required;
 const utilization=required/capacity*100;
 const withoutNew=current+com+rev;
 const maxNew=Math.max(0,capacity/(1+buf/100)-withoutNew);
 let html="<div>計画期間の実働キャパシティ："+fmt(capacity)+"時間</div>";
 html+="<div>現在の仕事＋新規案件＋連絡・修正："+fmt(work)+"時間</div>";
 html+="<div>予備時間込みの必要時間："+fmt(required)+"時間</div>";
 html+="<div class='big'>稼働率："+fmt(utilization)+"%</div>";
 html+="<div>予備時間を守った場合の新規案件に使える時間："+fmt(maxNew)+"時間</div>";
 if(free<0) html+="<div class='warn'>この条件では受け入れ上限を超えています。新規案件の工数を減らす、納期を延ばす、作業時間を増やすなどの見直しが必要です。</div>";
 else if(utilization>=90) html+="<div class='warn'>かなり余裕が少ない状態です。小さな追加作業でも納期に影響する可能性があります。</div>";
 else html+="<div class='ok'>予備時間を含めても、計画したキャパシティ内に収まっています。</div>";
 r.innerHTML=html;
}
calc();
</script></body></html>
