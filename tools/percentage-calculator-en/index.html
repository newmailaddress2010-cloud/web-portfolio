<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Calculator</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px}label{display:block;margin-top:16px;font-weight:bold}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:6px}button{margin-top:20px;background:#333;color:white;border:0;border-radius:8px}</style><div class="box"><h1>Percentage Calculator</h1><label>Value</label><input id="v" type="number"><label>Percentage (%)</label><input id="p" type="number"><button onclick="go()">Calculate</button><h2 id="r">—</h2></div><script>function go(){r.textContent=(+v.value*+p.value/100).toLocaleString()}</script>
