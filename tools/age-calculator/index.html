<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>年齢計算機</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:28px}label{display:block;margin:18px 0 8px;font-weight:bold}input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px;text-align:center}.age{font-size:30px;font-weight:bold}
</style></head><body><div class="box"><h1>年齢計算機</h1><label>生年月日</label><input id="birthday" type="date"><button onclick="calc()">年齢を計算</button><div class="result"><div class="age" id="age">---</div><p id="detail">生年月日を入力してください。</p></div></div>
<script>function calc(){const v=document.getElementById("birthday").value;if(!v){alert("生年月日を入力してください。");return}const b=new Date(v+"T00:00:00"),t=new Date();let a=t.getFullYear()-b.getFullYear();const d=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(t<d)a--;document.getElementById("age").textContent=a+"歳";document.getElementById("detail").textContent=b.getFullYear()+"年"+(b.getMonth()+1)+"月"+b.getDate()+"日生まれ"}</script></body></html>
