<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Line Sorter</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:700px;margin:40px auto;padding:24px;background:#fff;border-radius:14px}textarea,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px}textarea{height:220px}button{background:#333;color:#fff;border:0;border-radius:8px}</style><div class="box"><h1>Line Sorter</h1><textarea id="i" placeholder="One item per line"></textarea><button onclick="go(1)">Sort A–Z</button><button onclick="go(-1)">Sort Z–A</button><textarea id="o"></textarea></div><script>function go(d){let a=i.value.split(/\r?\n/);a.sort((x,y)=>x.localeCompare(y)*d);o.value=a.join('\n')}</script>
