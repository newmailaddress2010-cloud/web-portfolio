<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculate weighted GPA from grade points and credits.</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#1f2937}.wrap{max-width:620px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}h1{font-size:24px}.lead{color:#64748b;line-height:1.6}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}.result{margin-top:18px;padding:18px;background:#f8fafc;border-radius:12px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5e7eb}.err{color:#dc2626;margin-top:10px}</style></head><body><div class="wrap"><div class="card"><h1>Calculate weighted GPA from grade points and credits.</h1><p class="lead">成績ポイント</p><div class="field"><label>Grade Points (comma-separated)</label><input id="a" placeholder="4,3,3,2"></div><div class="field"><label>Credits (comma-separated)</label><input id="b" placeholder="2,2,1,2"></div><button onclick="calc()">Calculate</button><div id="err" class="err"></div><div id="res" class="result" hidden></div></div></div><script>const a=document.getElementById('a'),b=document.getElementById('b'),res=document.getElementById('res'),err=document.getElementById('err');function calc(){let g=a.value.split(',').map(Number),c=b.value.split(',').map(Number);if(!g.length||g.length!==c.length||g.some(x=>!Number.isFinite(x))||c.some(x=>!Number.isFinite(x)||x<=0)){err.textContent='Check your grade points and credits.';return}let t=c.reduce((x,y)=>x+y,0),v=g.reduce((x,y,i)=>x+y*c[i],0)/t;res.innerHTML='<div class="row"><span>Weighted GPA</span><strong>'+v.toFixed(2)+'</strong></div>';res.hidden=false}</script></body></html>
