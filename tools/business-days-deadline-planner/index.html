<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>営業日締切プランナー｜無料Webツール</title><meta name="description" content="開始日と必要な営業日数から締切日を計算できる無料ツール。土日と指定した祝日を除外できます。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:600}input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px}button{padding:10px 15px;border:0;border-radius:7px;background:#333;color:#fff;cursor:pointer}.result{font-size:19px;line-height:2}.big{font-size:29px;font-weight:700}.hint{color:#666;font-size:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><h1>営業日締切プランナー</h1><p>開始日から指定した営業日数を進めて、締切日を計算します。土日は自動で除外できます。</p><div class="box"><div class="grid"><label>開始日<input id="start" type="date"></label><label>必要な営業日数<input id="days" type="number" min="0" value="10"></label></div><label style="display:block;margin-top:14px">除外する祝日・休業日（任意・カンマ区切り）<input id="holidays" placeholder="2026-11-03,2026-11-23"></label><p class="hint">祝日を自動取得するのではなく、指定した日付だけを除外します。</p></div><div class="box"><div class="result">締切日：<span class="big" id="result"></span><br>経過日数：<span id="calendarDays"></span> 日</div><button onclick="copyResult()">結果をコピー</button></div><script>const now=new Date();start.value=now.toISOString().slice(0,10);['start','days','holidays'].forEach(id=>document.getElementById(id).addEventListener('input',calc));function key(d){return d.toISOString().slice(0,10)}function calc(){let d=new Date(start.value+'T00:00:00'),need=Math.max(0,+days.value||0),hs=new Set(holidays.value.split(',').map(x=>x.trim()).filter(Boolean)),n=0;let begin=new Date(d);while(n<need){d.setDate(d.getDate()+1);let w=d.getDay(),k=key(d);if(w!==0&&w!==6&&!hs.has(k))n++}result.textContent=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});calendarDays.textContent=Math.round((d-begin)/86400000)}function copyResult(){navigator.clipboard.writeText('【営業日締切】\n開始日：'+start.value+'\n必要営業日数：'+days.value+'日\n締切日：'+result.textContent);alert('結果をコピーしました。')}calc();</script></body></html>
