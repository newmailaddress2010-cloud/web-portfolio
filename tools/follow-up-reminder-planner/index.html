<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案件フォローアップ予定日メーカー｜無料Webツール</title><meta name="description" content="問い合わせや見積もり送付後のフォローアップ予定日を計算できる無料ツール。何日後に連絡するかを整理できます。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:600}input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px}.result{font-size:19px;line-height:2}.big{font-size:29px;font-weight:700}button{padding:10px 15px;border:0;border-radius:7px;background:#333;color:#fff;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><h1>案件フォローアップ予定日メーカー</h1><p>見積もりや問い合わせへの対応後、「いつ頃もう一度連絡するか」を簡単に決められます。</p><div class="box"><div class="grid"><label>基準日<input id="base" type="date"></label><label>何日後に連絡する？<input id="after" type="number" min="0" value="3"></label></div></div><div class="box"><div class="result">フォローアップ予定日：<span class="big" id="result"></span></div><button onclick="copyResult()">結果をコピー</button></div><script>base.value=new Date().toISOString().slice(0,10);['base','after'].forEach(id=>document.getElementById(id).addEventListener('input',calc));function calc(){let d=new Date(base.value+'T00:00:00');d.setDate(d.getDate()+(+after.value||0));result.textContent=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'})}function copyResult(){navigator.clipboard.writeText('【フォローアップ予定】\n基準日：'+base.value+'\n予定日：'+result.textContent);alert('結果をコピーしました。')}calc();</script></body></html>
