<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電気代計算機</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#1f2937}.wrap{max-width:620px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}h1{font-size:24px}.lead{color:#64748b;line-height:1.6}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}.result{margin-top:18px;padding:18px;background:#f8fafc;border-radius:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e5e7eb}.row:last-child{border:0}.err{color:#dc2626;margin-top:10px}</style></head><body><div class="wrap"><div class="card"><h1>電気代計算機</h1><p class="lead">消費電力・使用時間・電気料金単価から電気代の目安を計算します。</p><div class="field"><label>消費電力（W）</label><input id="w" type="number" min="0" step="any" placeholder="100"></div><div class="field"><label>1日の使用時間（時間）</label><input id="h" type="number" min="0" step="any" placeholder="8"></div><div class="field"><label>電気料金単価（円/kWh）</label><input id="r" type="number" min="0" step="any" value="31"></div><div class="field"><label>使用日数</label><input id="d" type="number" min="0" step="any" value="30"></div><button onclick="calc()">計算する</button><div id="err" class="err"></div><div id="res" class="result" hidden><div class="row"><span>1日の消費電力量</span><strong id="day"></strong></div><div class="row"><span>期間の消費電力量</span><span id="total"></span></div><div class="row"><span>期間の電気代</span><strong id="cost"></strong></div></div></div></div><script>function calc(){const w=Number(document.getElementById('w').value),h=Number(document.getElementById('h').value),r=Number(document.getElementById('r').value),d=Number(document.getElementById('d').value),e=document.getElementById('err'),res=document.getElementById('res');if([w,h,r,d].some(x=>!Number.isFinite(x)||x<0)){e.textContent='すべて0以上の数値を入力してください。';res.hidden=true;return}e.textContent='';res.hidden=false;const day=w*h/1000,total=day*d,cost=total*r;document.getElementById('day').textContent=day.toLocaleString('ja-JP',{maximumFractionDigits:3})+' kWh';document.getElementById('total').textContent=total.toLocaleString('ja-JP',{maximumFractionDigits:3})+' kWh';document.getElementById('cost').textContent=cost.toLocaleString('ja-JP',{maximumFractionDigits:0})+' 円'}</script></body></html>
