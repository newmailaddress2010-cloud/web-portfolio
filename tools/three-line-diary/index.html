<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#333333">
<meta name="description" content="何を書けばいいかわからない人向けの3行日記。質問に答えるだけで、今日の小さなことを3つ記録できます。">
<link rel="manifest" href="manifest.json">
<title>書けない人の3行日記</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#333;font-family:Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.wrap{max-width:720px;margin:0 auto;padding:16px 12px 40px}.card{background:#fff;border-radius:16px;padding:20px 16px;box-shadow:0 3px 16px rgba(0,0,0,.07)}h1{font-size:24px;margin:0 0 8px}.lead{color:#666;line-height:1.7;font-size:15px}.date{text-align:right;color:#777;font-size:14px;margin-bottom:18px}.q{margin-top:20px;font-weight:bold;font-size:17px}.hint{font-size:13px;color:#888;margin:5px 0 8px}textarea{width:100%;min-height:88px;resize:vertical;padding:12px;border:1px solid #d5d5d5;border-radius:10px;font-size:16px;line-height:1.6}textarea:focus{outline:2px solid #b8d4f5;border-color:#1976d2}button{width:100%;min-height:48px;padding:12px;border:0;border-radius:10px;background:#333;color:#fff;font-size:16px;cursor:pointer;touch-action:manipulation}.save{margin-top:20px}.todaybtn{margin-top:10px;background:#eee;color:#333}.saved{margin-top:14px;padding:12px;border-radius:9px;background:#f1f3f5;display:none}.calendar{margin-top:28px}.cal-head{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}.cal-head button{min-height:44px;padding:8px 10px;font-size:14px}.cal-head button:last-child{grid-column:3}.month{text-align:center;font-weight:bold;font-size:17px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.week div{text-align:center;font-size:12px;color:#777;padding:5px}.day{min-height:42px;border:1px solid #e2e2e2;border-radius:7px;background:#fff;text-align:center;padding:10px 2px;cursor:pointer}.day.has{font-weight:bold;color:#1976d2;background:#eef5ff;border-color:#b8d4f5}.day.today{box-shadow:inset 0 0 0 2px #777}.day.selected{outline:2px solid #555}.day.empty{background:transparent;border:0;cursor:default}.history{margin-top:22px}.entry{border-top:1px solid #ddd;padding:15px 0}.entry strong{display:block;margin-bottom:7px}.entry p{margin:7px 0;line-height:1.6}.editbtn{margin-top:10px;background:#eee;color:#333;font-size:14px;min-height:44px}.emptymsg{color:#888;font-size:14px;line-height:1.6}@media(min-width:600px){.wrap{padding:30px 18px 50px}.card{padding:26px}h1{font-size:26px}}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>書けない人の3行日記</h1>
<p class="lead">「今日、良かったことを3つ」と言われても思いつかない。<br>そんなときは、質問に答えるだけで大丈夫です。</p>
<div class="date" id="today"></div>
<div class="q">① 今日、ちょっと楽だったことは？</div><div class="hint">大きな出来事でなくてOK。</div>
<textarea id="a" placeholder="例：昼に食べたカレーがおいしかった"></textarea>
<div class="q">② 今日、できたことは？</div><div class="hint">「起きた」「メールを返した」くらいでもOKです。</div>
<textarea id="b" placeholder="例：洗濯をした"></textarea>
<div class="q">③ 今日、ちょっと嬉しかったことは？</div><div class="hint">小さなことで十分です。</div>
<textarea id="c" placeholder="例：好きな動画を見つけた"></textarea>
<button class="save" onclick="save()">今日の日記を保存する</button>
<button class="todaybtn" onclick="goToday()">今日に戻る</button>
<div class="saved" id="saved"></div>
<div class="calendar"><h2>過去の日記</h2><div class="cal-head"><button onclick="moveMonth(-1)">‹ 前月</button><div class="month" id="month"></div><button onclick="moveMonth(1)">翌月 ›</button></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="days" id="days"></div></div>
<div class="history" id="history"><div class="emptymsg">カレンダーの日付を選ぶと、その日の内容が表示されます。</div></div>
</div></div>
<script>
const key="threeLineDiaryEntries";let view=new Date(),selected="";
function dateKey(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function dateText(y,m,d){return y+"年"+(m+1)+"月"+d+"日"}
function getEntries(){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return[]}}
function todayKey(){const d=new Date();return dateKey(d.getFullYear(),d.getMonth(),d.getDate())}
function fillEntry(k){const e=getEntries().find(x=>x.date===k);if(!e)return;document.getElementById("a").value=e.values[0]||"";document.getElementById("b").value=e.values[1]||"";document.getElementById("c").value=e.values[2]||""}
function goToday(){const d=new Date();view=new Date(d.getFullYear(),d.getMonth(),1);selected=todayKey();fillEntry(selected);renderCalendar();showEntry(selected);window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("today").textContent=dateText(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())+"の日記";
function save(){const values=["a","b","c"].map(id=>document.getElementById(id).value.trim());if(values.every(v=>!v)){alert("何か1つでも書いてみてください。短くて大丈夫です。");return}const d=new Date();let entries=getEntries(),k=todayKey();entries=entries.filter(x=>x.date!==k);entries.unshift({date:k,display:dateText(d.getFullYear(),d.getMonth(),d.getDate()),values});localStorage.setItem(key,JSON.stringify(entries));document.getElementById("saved").style.display="block";document.getElementById("saved").textContent="保存しました。";selected=k;view=new Date(d.getFullYear(),d.getMonth(),1);renderCalendar();showEntry(k)}
function moveMonth(n){view.setMonth(view.getMonth()+n);renderCalendar()}
function renderCalendar(){const y=view.getFullYear(),m=view.getMonth(),entries=getEntries(),has=new Set(entries.map(e=>e.date)),tk=todayKey();document.getElementById("month").textContent=y+"年"+(m+1)+"月";const el=document.getElementById("days");el.innerHTML="";for(let i=0;i<new Date(y,m,1).getDay();i++)el.innerHTML+='<div class="day empty"></div>';for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const k=dateKey(y,m,d),div=document.createElement("div");div.className="day"+(has.has(k)?" has":"")+(k===tk?" today":"")+(selected===k?" selected":"");div.textContent=d;div.onclick=()=>{selected=k;showEntry(k);fillEntry(k);renderCalendar()};el.appendChild(div)}}
function showEntry(k){const e=getEntries().find(x=>x.date===k),el=document.getElementById("history");if(!e){el.innerHTML='<div class="emptymsg">'+k.replace(/-/g,"/")+'の日記はありません。</div>';return}el.innerHTML='<div class="entry"><strong>'+e.display+'</strong>'+e.values.map(v=>v?'<p>・'+v.replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</p>':'').join("")+'<button class="editbtn" onclick="editSelected()">この日の日記を編集する</button></div>'}
function editSelected(){if(!selected)return;fillEntry(selected);window.scrollTo({top:0,behavior:"smooth"})}
goToday();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
