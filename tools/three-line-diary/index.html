<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#7c8f86">
<meta name="description" content="何を書けばいいかわからない人向けの3行日記。質問に答えるだけで、今日の小さなことを3つ記録できます。">
<link rel="manifest" href="manifest.json">
<title>書けない人の3行日記</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1ea;color:#39413e;font-family:Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.wrap{max-width:720px;margin:0 auto;padding:14px 12px 42px}.card{background:#fffdf9;border-radius:22px;padding:20px 16px;box-shadow:0 5px 22px rgba(72,65,53,.08)}.head{padding:4px 2px 10px}h1{font-size:24px;margin:0 0 9px;letter-spacing:.02em}.lead{color:#68706d;line-height:1.75;font-size:15px;margin:0}.date{text-align:right;color:#7b817e;font-size:14px;margin:12px 2px 18px}.gentle{background:#f1f4ef;border-radius:14px;padding:10px 12px;color:#65716a;font-size:13px;line-height:1.6;margin-bottom:16px}.points{display:flex;align-items:center;justify-content:space-between;background:#f7f1df;border:1px solid #e9dfc5;border-radius:14px;padding:11px 13px;margin-bottom:16px}.points-label{font-size:13px;color:#77715f}.points-value{font-size:20px;font-weight:bold;color:#81704a}.points-note{font-size:12px;color:#91886f;margin-top:2px}.growth{font-size:14px;color:#68766d;margin-top:4px}.growth-next{font-size:12px;color:#91886f;margin-top:2px}.qbox{margin-top:17px}.q{display:flex;align-items:center;gap:9px;font-weight:bold;font-size:16px;line-height:1.5}.num{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#e5ece7;color:#60756a;font-size:14px;flex:none}.hint{font-size:13px;color:#8a908d;margin:5px 0 8px 37px}textarea{width:100%;min-height:86px;resize:vertical;padding:12px;border:1px solid #ddd9d0;border-radius:13px;background:#fff;font-size:16px;line-height:1.6;color:#39413e}textarea:focus{outline:2px solid #d5e1da;border-color:#9daba6}button{width:100%;min-height:48px;padding:12px;border:0;border-radius:13px;background:#70867b;color:#fff;font-size:16px;cursor:pointer;touch-action:manipulation}.save{margin-top:20px;box-shadow:0 3px 9px rgba(82,103,93,.16)}.todaybtn{margin-top:9px;background:#f0eee9;color:#59615d}.saved{margin-top:13px;padding:12px 14px;border-radius:12px;background:#edf3ee;color:#63766b;display:none;text-align:center;font-size:14px}.monthly{margin-top:28px;padding:15px 15px 12px;border-radius:16px;background:#f7f4ed;border:1px solid #e7e1d6}.monthly-title{font-weight:bold;font-size:15px}.count{font-size:14px;color:#6f7773;margin-top:5px}.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}.dot{width:8px;height:8px;border-radius:50%;background:#ddd8ce}.dot.on{background:#8ca496}.calendar{margin-top:22px}.calendar h2{font-size:18px;margin:0 0 12px}.cal-head{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}.cal-head button{min-height:42px;padding:8px 10px;font-size:14px;background:#eeeae3;color:#59615d}.cal-head button:last-child{grid-column:3}.month{text-align:center;font-weight:bold;font-size:16px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;font-size:12px;color:#858b88;padding:5px}.day{min-height:42px;border:1px solid #e5e1d8;border-radius:8px;background:#fff;text-align:center;padding:10px 2px;cursor:pointer;color:#555d59}.day.has{font-weight:bold;color:#5f796c;background:#edf3ee;border-color:#c9d8ce}.day.today{box-shadow:inset 0 0 0 2px #91a69a}.day.selected{outline:2px solid #70867b}.day.empty{background:transparent;border:0;cursor:default}.history{margin-top:20px}.entry{border-top:1px solid #e4e0d8;padding:15px 0}.entry strong{display:block;margin-bottom:7px;color:#5d6d64}.entry p{margin:7px 0;line-height:1.6}.editbtn{margin-top:10px;background:#f0eee9;color:#59615d;font-size:14px;min-height:44px}.emptymsg{color:#8a908d;font-size:14px;line-height:1.7;padding:4px 0 8px}.status{font-size:13px;color:#7b817e;text-align:center;margin-top:10px}@media(min-width:600px){.wrap{padding:30px 18px 50px}.card{padding:28px}.head{padding:0 2px 8px}h1{font-size:27px}}
</style>
</head>
<body><div class="wrap"><div class="card">
<div class="head"><h1>書けない人の3行日記</h1><p class="lead">「今日、良かったことを3つ」と言われても思いつかない。<br>そんなときは、質問に答えるだけで大丈夫です。</p></div>
<div class="date" id="today"></div>
<div class="gentle" id="gentle"></div>
<div class="points"><div><div class="points-label">今日もここに来た</div><div class="points-note" id="pointNote">今日のポイント</div><div class="growth" id="growth"></div><div class="growth-next" id="growthNext"></div></div><div class="points-value"><span id="points">0</span> pt</div></div>
<div class="qbox"><div class="q"><span class="num">1</span>今日、ちょっと楽だったことは？</div><div class="hint">大きな出来事でなくてOK。</div><textarea id="a" placeholder="例：昼に食べたカレーがおいしかった"></textarea></div>
<div class="qbox"><div class="q"><span class="num">2</span>今日、できたことは？</div><div class="hint">「起きた」「メールを返した」くらいでもOKです。</div><textarea id="b" placeholder="例：洗濯をした"></textarea></div>
<div class="qbox"><div class="q"><span class="num">3</span>今日、ちょっと嬉しかったことは？</div><div class="hint">小さなことで十分です。</div><textarea id="c" placeholder="例：好きな動画を見つけた"></textarea></div>
<button class="save" onclick="save()">今日の日記を保存する</button>
<button class="todaybtn" onclick="goToday()">今日に戻る</button>
<div class="saved" id="saved"></div>
<div class="status" id="status"></div>
<div class="monthly"><div class="monthly-title" id="monthlyTitle">今月の記録</div><div class="count" id="count"></div><div class="dots" id="dots"></div></div>
<div class="calendar"><h2>過去の日記</h2><div class="cal-head"><button onclick="moveMonth(-1)">‹ 前月</button><div class="month" id="month"></div><button onclick="moveMonth(1)">翌月 ›</button></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="days" id="days"></div></div>
<div class="history" id="history"><div class="emptymsg">カレンダーの日付を選ぶと、その日の内容が表示されます。</div></div>
</div></div>
<script>
const key="threeLineDiaryEntries",pointKey="threeLineDiaryPoints",pointDateKey="threeLineDiaryPointDate",writeDateKey="threeLineDiaryWriteDate";let view=new Date(),selected="";
const gentleMessages=["1行だけでも大丈夫です。","空欄があっても大丈夫です。","短くても、今日の記録です。","昨日の自分と比べなくてOKです。","今日はここまで、でも十分です。"];
function dateKey(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function dateText(y,m,d){return y+"年"+(m+1)+"月"+d+"日"}
function getEntries(){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch(e){return[]}}
function todayKey(){const d=new Date();return dateKey(d.getFullYear(),d.getMonth(),d.getDate())}
function fillEntry(k){const e=getEntries().find(x=>x.date===k);document.getElementById("a").value=e?.values?.[0]||"";document.getElementById("b").value=e?.values?.[1]||"";document.getElementById("c").value=e?.values?.[2]||""}
function getPoints(){return Number(localStorage.getItem(pointKey)||0)}
function growthInfo(points){
  if(points>=100)return["🌳 大きな木になりました","ここまで続けました"];
  if(points>=50)return["🌳 木になりました","あと50ポイントで「大きな木」"];
  if(points>=30)return["🌿 少し育ちました","あと20ポイントで「木になった」"];
  if(points>=10)return["🌱 芽が出ました","あと20ポイントで「少し育った」"];
  return["🌱 芽を育てています","あと"+(10-points)+"ポイントで「芽が出た」"];
}
function updatePoints(){
  const points=getPoints(),info=growthInfo(points);
  document.getElementById("points").textContent=points;
  document.getElementById("growth").textContent=info[0];
  document.getElementById("growthNext").textContent=info[1];
}
function awardTodayPoint(){const today=todayKey(),last=localStorage.getItem(pointDateKey);let points=getPoints();if(last!==today){points++;localStorage.setItem(pointKey,String(points));localStorage.setItem(pointDateKey,today);document.getElementById("pointNote").textContent="今日の＋1ポイントを受け取りました。"}else{document.getElementById("pointNote").textContent="今日はもう開くポイントを受け取っています。"}updatePoints()}
function awardWritePoint(){const today=todayKey(),last=localStorage.getItem(writeDateKey);if(last===today)return false;let points=getPoints()+1;localStorage.setItem(pointKey,String(points));localStorage.setItem(writeDateKey,today);updatePoints();return true}
function setStatus(){const done=getEntries().some(e=>e.date===todayKey());document.getElementById("status").textContent=done?"今日は記録済みです。":"今日はまだ記録していません。"}
function goToday(){const d=new Date();view=new Date(d.getFullYear(),d.getMonth(),1);selected=todayKey();fillEntry(selected);renderCalendar();showEntry(selected);setStatus();window.scrollTo({top:0,behavior:"smooth"})}
function save(){const values=["a","b","c"].map(id=>document.getElementById(id).value.trim());if(values.every(v=>!v)){alert("何か1つでも書いてみてください。短くて大丈夫です。");return}const d=new Date(),k=todayKey();let entries=getEntries();entries=entries.filter(x=>x.date!==k);entries.unshift({date:k,display:dateText(d.getFullYear(),d.getMonth(),d.getDate()),values});localStorage.setItem(key,JSON.stringify(entries));const earned=awardWritePoint();const saved=document.getElementById("saved");saved.style.display="block";saved.textContent=earned?"記録できました。＋1ポイントです。":"今日の3行、おつかれさまでした。";selected=k;view=new Date(d.getFullYear(),d.getMonth(),1);renderCalendar();showEntry(k);setStatus();setTimeout(()=>saved.style.display="none",3000)}
function moveMonth(n){view.setMonth(view.getMonth()+n);renderCalendar()}
function renderMonthly(){const d=view,y=d.getFullYear(),m=d.getMonth(),entries=getEntries(),set=new Set(entries.map(e=>e.date)),days=new Date(y,m+1,0).getDate();document.getElementById("monthlyTitle").textContent=y+"年"+(m+1)+"月の記録";document.getElementById("count").textContent="記録できた日："+[...set].filter(k=>{const p=k.split("-").map(Number);return p[0]===y&&p[1]===m+1}).length+"日";const dots=document.getElementById("dots");dots.innerHTML="";for(let i=1;i<=days;i++){const x=document.createElement("span");x.className="dot"+(set.has(dateKey(y,m,i))?" on":"");dots.appendChild(x)}}
function renderCalendar(){const y=view.getFullYear(),m=view.getMonth(),entries=getEntries(),has=new Set(entries.map(e=>e.date)),tk=todayKey();document.getElementById("month").textContent=y+"年"+(m+1)+"月";const el=document.getElementById("days");el.innerHTML="";for(let i=0;i<new Date(y,m,1).getDay();i++)el.innerHTML+='<div class="day empty"></div>';for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const k=dateKey(y,m,d),div=document.createElement("div");div.className="day"+(has.has(k)?" has":"")+(k===tk?" today":"")+(selected===k?" selected":"");div.textContent=d;div.onclick=()=>{selected=k;showEntry(k);fillEntry(k);renderCalendar()};el.appendChild(div)}renderMonthly()}
function showEntry(k){const e=getEntries().find(x=>x.date===k),el=document.getElementById("history");if(!e){el.innerHTML='<div class="emptymsg">'+k.replace(/-/g,"/")+'の日記はありません。</div>';return}el.innerHTML='<div class="entry"><strong>'+e.display+'</strong>'+e.values.map(v=>v?'<p>・'+v.replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</p>':"").join("")+'<button class="editbtn" onclick="editSelected()">この日の日記を編集する</button></div>'}
function editSelected(){if(!selected)return;fillEntry(selected);window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("today").textContent=dateText(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())+"の日記";
document.getElementById("gentle").textContent=gentleMessages[Math.floor(Math.random()*gentleMessages.length)];
awardTodayPoint();goToday();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
