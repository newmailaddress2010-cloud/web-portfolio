<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>資金残高予測チェック｜いつお金が足りなくなる？</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:auto;padding:20px;background:#f6f7f9;color:#222;line-height:1.6}
main{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 12px #0001}h1{font-size:24px;margin-top:0}.lead{color:#555}
label{display:block;margin-top:16px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{margin-top:20px;padding:12px 18px;border:0;border-radius:8px;background:#333;color:#fff;font-size:16px}.result{margin-top:22px;padding:18px;background:#f0f3f6;border-radius:10px}
.big{font-size:30px;font-weight:700}.warn{margin-top:12px;font-weight:600}.ok{margin-top:12px;font-weight:600}.note{font-size:13px;color:#666;margin-top:16px}
table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:9px 6px;border-bottom:1px solid #ddd;text-align:right}th:first-child,td:first-child{text-align:left}
</style></head><body><main>
<h1>資金残高予測チェック</h1>
<p class="lead">今あるお金と今後の入金・支出から、毎月の残高を予測し「いつ資金が苦しくなるか」を確認します。</p>
<label>現在の現金残高（円）<input id="cash" type="number" min="0" value="200000"></label>
<label>毎月の入金予定（円）<input id="income" type="number" min="0" value="150000"></label>
<label>毎月の固定支出（円）<input id="fixed" type="number" min="0" value="100000"></label>
<label>毎月の変動支出（円）<input id="variable" type="number" min="0" value="30000"></label>
<label>毎月取り置く税金・予備費（円）<input id="reserve" type="number" min="0" value="10000"></label>
<label>一時的な支出（円）<input id="oneoff" type="number" min="0" value="0"></label>
<label>一時的な支出がある月（何か月後）<input id="oneoffMonth" type="number" min="1" step="1" value="3"></label>
<label>最低限残したい現金（円）<input id="minimum" type="number" min="0" value="50000"></label>
<label>何か月先まで見るか<input id="months" type="number" min="1" max="36" step="1" value="12"></label>
<button onclick="calc()">資金を予測する</button>
<div id="result" class="result"></div>
<p class="note">これは簡易的な資金繰り予測です。売掛金の回収遅れ、税率の変化、借入返済などは個別に反映していません。実際の資金管理では入出金予定を確認してください。</p>
</main>
<script>
function n(id){return Number(document.getElementById(id).value)||0}
function yen(x){return Math.round(x).toLocaleString("ja-JP")+"円"}
function calc(){
 const cash=n("cash"),income=n("income"),fixed=n("fixed"),variable=n("variable"),reserve=n("reserve"),oneoff=n("oneoff"),om=Math.floor(n("oneoffMonth")),minimum=n("minimum"),months=Math.min(36,Math.floor(n("months"))),r=document.getElementById("result");
 if(cash<0||income<0||fixed<0||variable<0||reserve<0||oneoff<0||om<1||minimum<0||months<1){r.textContent="入力値を確認してください。";return}
 let bal=cash,minBal=cash,minMonth=0,rows="";
 for(let m=1;m<=months;m++){
  bal+=income-fixed-variable-reserve;
  if(m===om) bal-=oneoff;
  if(bal<minBal){minBal=bal;minMonth=m}
  rows+="<tr><td>"+m+"か月後</td><td>"+yen(bal)+"</td><td>"+(bal<minimum?"注意":"")+"</td></tr>";
 }
 let status=minBal<minimum?"<div class='warn'>最低限残したい現金を下回る可能性があります。最も低くなるのは"+minMonth+"か月後です。</div>":"<div class='ok'>予測期間内では、最低限残したい現金を下回りません。</div>";
 r.innerHTML="<div>予測期間："+months+"か月</div><div class='big'>最低残高："+yen(minBal)+"</div>"+status+
 "<table><tr><th>時点</th><th>予測残高</th><th>判定</th></tr>"+rows+"</table>";
}
calc();
</script></body></html>
