<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>制作依頼ヒアリングシートメーカー｜無料Webツール</title><meta name="description" content="Web制作やデザインの依頼を受けるときのヒアリング項目を選んで質問文を作成できる無料ツール。聞き漏れ防止に使えます。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:900px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin:14px 0}label{display:block;padding:9px;border-bottom:1px solid #eee}button{padding:10px 14px;border:0;border-radius:7px;background:#333;color:#fff;margin:4px;cursor:pointer}.result{white-space:pre-wrap;background:#fafafa;border:1px solid #ddd;border-radius:8px;padding:14px;line-height:1.7;min-height:240px}.count{color:#666}</style></head><body><h1>制作依頼ヒアリングシートメーカー</h1><p>必要な質問を選ぶだけで、依頼者に送る確認事項をまとめられます。入力内容はこのブラウザ内だけで処理します。</p><div class="box"><input id="name" placeholder="依頼者名・会社名（任意）" style="width:100%;box-sizing:border-box;padding:9px"></div><div class="box"><h2>確認したい項目</h2><div id="checks"></div><p class="count" id="count"></p><button onclick="allOn()">すべて選択</button><button onclick="allOff()">すべて解除</button></div><div class="box"><h2>作成結果</h2><div id="result" class="result"></div><button onclick="copyResult()">質問文をコピー</button></div><script>const items=[['目的・ゴール','今回の制作で達成したいこと、特に重視したいことを教えてください。'],['ターゲット','主なターゲット（年齢層・地域・利用者像など）を教えてください。'],['掲載内容','掲載したい文章、写真、ロゴ、資料など、用意できている素材を教えてください。'],['必要ページ','必要なページや画面を教えてください。'],['デザイン','希望する雰囲気、色、参考にしたいサイトなどがあれば教えてください。'],['機能','問い合わせフォーム、予約、SNS連携など、必要な機能を教えてください。'],['スマホ対応','スマートフォン表示について特に希望することがあれば教えてください。'],['公開先','新規制作か既存サイトの修正か。ドメインやサーバーがあれば教えてください。'],['納期','希望納期、公開希望日、動かせない締切があれば教えてください。'],['予算','今回の制作で想定している予算帯があれば教えてください。'],['修正','公開前の確認・修正について希望があれば教えてください。'],['参考資料','参考サイト、競合サイト、既存資料など、共有できるものがあれば教えてください。']];items.forEach((x,i)=>checks.insertAdjacentHTML('beforeend','<label><input type="checkbox" data-i="'+i+'" checked> '+x[0]+'</label>'));checks.querySelectorAll('input').forEach(x=>x.addEventListener('change',render));name.addEventListener('input',render);function selected(){return [...checks.querySelectorAll('input:checked')].map(x=>items[+x.dataset.i])}function render(){let s=(name.value?'【'+name.value+' 制作ヒアリング】\n\n':'【制作ヒアリング】\n\n')+selected().map((x,i)=>(i+1)+'. '+x[0]+'\n'+x[1]).join('\n\n');result.textContent=s;count.textContent=selected().length+'項目を選択中'}function allOn(){checks.querySelectorAll('input').forEach(x=>x.checked=true);render()}function allOff(){checks.querySelectorAll('input').forEach(x=>x.checked=false);render()}function copyResult(){navigator.clipboard.writeText(result.textContent);alert('質問文をコピーしました。')}render();</script></body></html>
