<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支払遅延利息計算機｜無料Webツール</title><meta name="description" content="支払期日と支払日、請求額、年率から支払遅延期間と遅延利息の目安を計算できる無料ツールです。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:600}input{box-sizing:border-box;width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px}button{padding:10px 15px;border:0;border-radius:7px;background:#333;color:#fff;cursor:pointer}.result{font-size:19px;line-height:2}.big{font-size:27px;font-weight:700}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><h1>支払遅延利息計算機</h1><p>支払期日から実際の支払日までの日数と、入力した年率による利息の目安を計算します。</p><div class="box"><div class="grid"><label>請求額（円）<input id="amount" type="number" min="0" value="100000"></label><label>年率（%）<input id="rate" type="number" min="0" step=".01" value="3"></label><label>支払期日<input id="due" type="date"></label><label>実際の支払日<input id="paid" type="date"></label></div></div><div class="box"><div class="result">遅延日数：<span id="days">0</span> 日<br>利息の目安：<span class="big" id="interest">0</span> 円<br>元金＋利息：<span class="big" id="total">0</span> 円</div><button onclick="copyResult()">結果をコピー</button></div><p>※契約条件や適用される法令・利率によって扱いが異なる場合があります。これは入力した年率による単純計算の目安です。</p><script>const today=new Date();function iso(d){return d.toISOString().slice(0,10)}due.value=iso(new Date(today.getFullYear(),today.getMonth(),today.getDate()-30));paid.value=iso(today);['amount','rate','due','paid'].forEach(id=>document.getElementById(id).addEventListener('input',calc));function calc(){let a=+amount.value||0,r=+rate.value||0,d1=new Date(due.value),d2=new Date(paid.value),days=Math.max(0,Math.floor((d2-d1)/86400000)),i=a*r/100*days/365;daysEl=days;document.getElementById('days').textContent=days;interest.textContent=Math.round(i).toLocaleString();total.textContent=Math.round(a+i).toLocaleString()}function copyResult(){let t='【支払遅延利息の計算】\n請求額：'+(+amount.value||0).toLocaleString()+'円\n遅延日数：'+document.getElementById('days').textContent+'日\n利息の目安：'+interest.textContent+'円\n元金＋利息：'+total.textContent+'円';navigator.clipboard.writeText(t);alert('結果をコピーしました。')}calc();</script></body></html>
