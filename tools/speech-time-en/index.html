<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speech Time Calculator</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:650px;margin:40px auto;padding:24px;background:#fff;border-radius:14px}textarea,input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px}textarea{height:220px}button{background:#333;color:#fff;border:0;border-radius:8px}</style><div class="box"><h1>Speech Time Calculator</h1><textarea id="t" placeholder="Paste your speech"></textarea><input id="w" type="number" value="300" placeholder="Words per minute"><button onclick="go()">Calculate</button><h2 id="r">—</h2></div><script>function go(){let n=t.value.trim().split(/\s+/).filter(Boolean).length;let m=n/(+w.value||300);r.textContent=m<1?Math.ceil(m*60)+' seconds':Math.floor(m)+' min '+Math.round(m%1*60)+' sec'}</script>
