<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案件採算チェックメーカー｜無料Webツール</title><meta name="description" content="案件の売上、作業時間、外注費、経費から利益と実質時給を確認できる無料ツール。フリーランスや小規模事業者の案件判断に使えます。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:850px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:600}input{box-sizing:border-box;width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px}.result{font-size:18px;line-height:2}.big{font-size:27px;font-weight:700}button{padding:10px 15px;border:0;border-radius:7px;background:#333;color:#fff;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><h1>案件採算チェックメーカー</h1><p>「この案件を受けると実際いくら残る？」を確認するための簡易ツールです。</p><div class="box"><div class="grid"><label>受注金額（円）<input id="sales" type="number" min="0" value="50000"></label><label>作業時間（時間）<input id="hours" type="number" min="0" step=".1" value="10"></label><label>外注費（円）<input id="outsourcing" type="number" min="0" value="0"></label><label>その他経費（円）<input id="expense" type="number" min="0" value="0"></label></div></div><div class="box"><div class="result">売上：<span id="s"></span> 円<br>総コスト：<span id="c"></span> 円<br>利益：<span class="big" id="p"></span> 円<br>利益率：<span id="m"></span> %<br>実質時給：<span class="big" id="r"></span> 円/時</div></div><div class="box"><button onclick="copyResult()">結果をコピー</button></div><script>const ids=['sales','hours','outsourcing','expense'];ids.forEach(id=>document.getElementById(id).addEventListener('input',calc));function n(id){return +document.getElementById(id).value||0}function yen(x){return Math.round(x).toLocaleString('ja-JP')}function calc(){let sales=n('sales'),cost=n('outsourcing')+n('expense'),profit=sales-cost,h=n('hours'),margin=sales?profit/sales*100:0,rate=h?profit/h:0;s.textContent=yen(sales);c.textContent=yen(cost);p.textContent=yen(profit);m.textContent=margin.toFixed(1);r.textContent=yen(rate)}function copyResult(){let t='【案件採算チェック】\n売上：'+s.textContent+'円\n総コスト：'+c.textContent+'円\n利益：'+p.textContent+'円\n利益率：'+m.textContent+'%\n実質時給：'+r.textContent+'円/時';navigator.clipboard.writeText(t);alert('結果をコピーしました。')}calc();</script></body></html>
