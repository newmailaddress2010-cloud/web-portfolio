<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="目標金額、現在の貯金額、毎月の積立額から貯金目標までの期間を計算できる無料ツールです。">
<title>Savings Goal Calculator</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:28px;margin:0 0 8px}.lead{text-align:center;color:#666;margin:0 0 24px}label{display:block;margin:18px 0 8px;font-weight:bold}input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px}.main{font-size:30px;font-weight:bold;text-align:center;margin:8px 0 18px}.row{display:flex;justify-content:space-between;gap:12px;margin:12px 0}.value{font-weight:bold}.note{font-size:13px;color:#666;line-height:1.6;margin-top:18px}@media(max-width:600px){.box{margin:16px;padding:22px}.main{font-size:27px}}</style></head>
<body><div class="box"><h1>貯金目標計算機</h1><p class="lead">Calculate how many months it will take to reach your savings goal</p>
<label>Savings goal</label><input id="target" type="number" min="0" placeholder="例：1000000">
<label>Current savings</label><input id="current" type="number" min="0" placeholder="例：200000">
<label>Monthly savings</label><input id="monthly" type="number" min="1" placeholder="例：30000">
<button onclick="calc()">Calculate</button>
<div class="result"><div class="main" id="months">---</div><div class="row"><span>Amount remaining</span><span class="value" id="shortage">---</span></div><div class="row"><span>Total after saving</span><span class="value" id="total">---</span></div></div>
<p class="note">This calculator assumes a fixed monthly saving amount and does not include interest, investment returns, or extra income.</p></div>
<script>function yen(n){return Math.round(n).toLocaleString()+""}function calc(){const t=Number(document.getElementById("target").value),c=Number(document.getElementById("current").value),m=Number(document.getElementById("monthly").value);if(!Number.isFinite(t)||t<0||!Number.isFinite(c)||c<0||!Number.isFinite(m)||m<=0){alert("Please enter valid numbers.");return}const d=Math.max(0,t-c),months=Math.ceil(d/m),total=c+months*m;document.getElementById("months").textContent=months+" months";document.getElementById("shortage").textContent=yen(d);document.getElementById("total").textContent=yen(total)}</script></body></html>
