<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSV列抽出・削除ツール</title>
<meta name="description" content="CSVを貼り付けて、必要な列だけを抽出したり不要な列を削除したりできる無料ツールです。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
<h1>CSV列抽出・削除ツール</h1>
<p class="lead">CSVを貼り付けて、残したい列だけを指定して取り出せます。</p>
<section class="card">
<label for="input">CSV</label>
<textarea id="input" placeholder="名前,年齢,住所,電話番号&#10;田中,30,東京都,090-xxxx-xxxx"></textarea>
<label for="columns">残したい列番号</label>
<input id="columns" type="text" placeholder="例：1,3">
<p class="hint">1から数えます。例「1,3」なら1列目と3列目を残します。</p>
<div class="buttons">
<button id="extract">指定列だけ残す</button>
<button id="remove" class="secondary">指定列を削除</button>
</div>
</section>
<section class="card result-card">
<div class="result-head"><h2>結果</h2><button id="copy" class="small">コピー</button></div>
<textarea id="output" readonly placeholder="ここに結果が表示されます"></textarea>
</section>
<section class="card guide">
<h2>使い方</h2>
<p>CSVを貼り付け、残したい列または削除したい列の番号をカンマ区切りで入力してください。</p>
<p>処理はブラウザ内で行います。入力したCSVを外部サーバーへ送信しません。</p>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
