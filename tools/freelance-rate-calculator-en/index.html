<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freelance Rate Calculator</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:0 auto;padding:20px;background:#f6f7f9;color:#222;line-height:1.6}
main{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 12px #0001}
h1{font-size:24px;margin-top:0}.lead{color:#555}
label{display:block;margin-top:16px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{margin-top:20px;padding:12px 18px;border:0;border-radius:8px;background:#333;color:#fff;font-size:16px;cursor:pointer}
.result{margin-top:22px;padding:18px;background:#f0f3f6;border-radius:10px}.big{font-size:28px;font-weight:700}.note{font-size:13px;color:#666;margin-top:16px}
</style></head>
<body><main>
<h1>Freelance Rate Calculator</h1>
<p class="lead">Estimate the minimum hourly rate and monthly revenue needed to reach your annual income goal.</p>
<label>Annual income goal<input id="income" type="number" min="0" value="30000"></label>
<label>Annual business expenses<input id="expense" type="number" min="0" value="3000"></label>
<label>Annual billable hours<input id="hours" type="number" min="1" value="1200"></label>
<label>Tax and reserve buffer (%)<input id="tax" type="number" min="0" max="90" step="0.1" value="15"></label>
<button onclick="calc()">Calculate</button>
<div id="result" class="result"></div>
<p class="note">Estimate only. The income goal is treated as pre-tax personal income. Actual taxes, social insurance, expenses, non-billable work, and time off vary by individual circumstances.</p>
</main>
<script>
function n(id){return Number(document.getElementById(id).value)||0}
function money(x){return Math.round(x).toLocaleString("en-US")}
function calc(){
 const income=n("income"),expense=n("expense"),hours=n("hours"),tax=n("tax")/100;
 if(hours<=0||tax>=1){document.getElementById("result").textContent="Please check your inputs.";return}
 const base=income+expense,reserve=base*tax,revenue=base+reserve,hourly=revenue/hours;
 document.getElementById("result").innerHTML=
 "<div>Required annual revenue</div><div class='big'>$"+money(revenue)+"</div>"+
 "<div>Required monthly revenue: about $"+money(revenue/12)+"</div>"+
 "<div>Minimum hourly rate: about $"+money(hourly)+"</div>"+
 "<div>Tax/reserve buffer: about $"+money(reserve)+"</div>";
}
calc();
</script></body></html>
