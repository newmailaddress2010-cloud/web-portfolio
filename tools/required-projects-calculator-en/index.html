<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Required Projects Calculator</title><style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:auto;padding:20px;background:#f6f7f9;color:#222;line-height:1.6}main{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 12px #0001}h1{font-size:24px;margin-top:0}.lead{color:#555}label{display:block;margin-top:16px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}button{margin-top:20px;padding:12px 18px;border:0;border-radius:8px;background:#333;color:#fff;font-size:16px}.result{margin-top:22px;padding:18px;background:#f0f3f6;border-radius:10px}.big{font-size:30px;font-weight:700}.note{font-size:13px;color:#666;margin-top:16px}</style></head><body><main><h1>Required Projects Calculator</h1><p class="lead">Calculate how many projects you need each month to reach your revenue goal.</p>
<label>Monthly revenue goal<input id="target" type="number" min="0" value="3000"></label><label>Average project price<input id="price" type="number" min="1" value="500"></label><label>Available working days per month<input id="days" type="number" min="1" value="20"></label><label>Average work hours per project<input id="hours" type="number" min="0" step="0.1" value="5"></label><button onclick="calc()">Calculate</button><div id="result" class="result"></div><p class="note">This is a simple revenue estimate. Cancellations, discounts, expenses, taxes, sales time and admin time are not included.</p></main><script>
function n(id){return Number(document.getElementById(id).value)||0}function money(x){return Math.round(x).toLocaleString("en-US")}function calc(){const t=n("target"),p=n("price"),d=n("days"),h=n("hours"),r=document.getElementById("result");if(t<=0||p<=0||d<=0||h<0){r.textContent="Please check your inputs.";return}const jobs=Math.ceil(t/p),daily=jobs/d,totalH=jobs*h;r.innerHTML="<div>Required projects</div><div class='big'>"+jobs+" / month</div><div>Average project price: $"+money(p)+"</div><div>Average per day: "+daily.toFixed(2)+" projects</div><div>Project work time: about "+totalH.toFixed(1)+" hours/month</div><div>At a 10% higher project price: about "+Math.ceil(t/(p*1.1))+" projects/month</div>}calc();
</script></body></html>
