<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>家賃の日割り計算機</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:27px}label{display:block;margin:18px 0 8px;font-weight:bold}input,select,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.hint{font-size:13px;color:#666;margin-top:7px}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px;text-align:center}.main{font-size:28px;font-weight:bold}.row{display:flex;justify-content:space-between;margin:10px 0}</style></head>
<body><div class="box"><h1>家賃の日割り計算機</h1><label>月額家賃（円）</label><input id="rent" type="number" min="0" placeholder="例：80000"><label>対象月</label><input id="month" type="month"><label>入居日</label><input id="day" type="number" min="1" max="31" placeholder="例：15"><label>計算方式</label><select id="method"><option value="actual">実日数で計算</option><option value="30">30日固定で計算</option></select><button onclick="calc()">計算する</button><div class="result"><div class="main" id="result">---</div><div class="row"><span>対象日数</span><span id="days">---</span></div><div class="row"><span>1日あたり</span><span id="daily">---</span></div></div><div class="hint">※日割りの起算日・計算方式は契約によって異なります。契約書をご確認ください。</div></div>
<script>function calc(){const r=Number(document.getElementById("rent").value),m=document.getElementById("month").value,d=Number(document.getElementById("day").value),method=document.getElementById("method").value;if(!r||!m||!d){alert("必要な項目を入力してください。");return}const y=Number(m.slice(0,4)),mo=Number(m.slice(5,7)),last=new Date(y,mo,0).getDate();if(d<1||d>last){alert("入居日を正しく入力してください。");return}const n=last-d+1,base=method==="actual"?last:30,daily=r/base,amount=Math.round(daily*n);document.getElementById("result").textContent=amount.toLocaleString()+"円";document.getElementById("days").textContent=n+"日";document.getElementById("daily").textContent=Math.round(daily).toLocaleString()+"円"}</script></body></html>
