<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Row Tool</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:700px;margin:40px auto;padding:24px;background:#fff;border-radius:14px}textarea,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px}textarea{height:220px}button{background:#333;color:white;border:0;border-radius:8px}</style><div class="box"><h1>CSV Row Tool</h1><p>Extract or remove rows by row number.</p><textarea id="i" placeholder="Paste CSV here"></textarea><input id="n" placeholder="Row numbers, e.g. 1,3,5"><button onclick="pick()">Extract Rows</button><button onclick="del()">Remove Rows</button><textarea id="o"></textarea></div><script>function data(){return i.value.split(/\r?\n/).filter(Boolean)}function nums(){return new Set(n.value.split(",").map(x=>Number(x.trim())).filter(Boolean))}function pick(){let a=data(),s=nums();o.value=a.filter((_,i)=>s.has(i+1)).join("\n")}function del(){let a=data(),s=nums();o.value=a.filter((_,i)=>!s.has(i+1)).join("\n")}</script>
