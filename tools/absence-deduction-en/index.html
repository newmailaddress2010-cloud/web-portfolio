<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Absence Deduction Calculator</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:27px}label{display:block;margin:18px 0 8px;font-weight:bold}input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px;text-align:center}.main{font-size:28px;font-weight:bold}.row{display:flex;justify-content:space-between;margin:10px 0}.hint{font-size:13px;color:#666;margin-top:12px}</style></head>
<body><div class="box"><h1>Absence Deduction Calculator</h1><label>Monthly Salary (JPY)</label><input id="salary" type="number" min="0" placeholder="例：250000"><label>Scheduled Working Days</label><input id="workdays" type="number" min="1" placeholder="例：20"><label>Days Absent</label><input id="absence" type="number" min="0" step="0.5" placeholder="例：2"><button onclick="calc()">Calculate</button><div class="result"><div class="main" id="pay">---</div><div class="row"><span>Per Day</span><span id="daily">---</span></div><div class="row"><span>Deduction</span><span id="deduct">---</span></div></div><div class="hint">Actual deduction methods may vary depending on company rules and payroll procedures.</div></div>
<script>function calc(){const s=Number(document.getElementById("salary").value),w=Number(document.getElementById("workdays").value),a=Number(document.getElementById("absence").value);if(!s||!w||a<0||a>w){alert("Please enter valid numbers.");return}const daily=s/w,d=Math.round(daily*a),p=s-d;document.getElementById("pay").textContent=p.toLocaleString()+"円";document.getElementById("daily").textContent=Math.round(daily).toLocaleString()+"円";document.getElementById("deduct").textContent=d.toLocaleString()+"円"}</script></body></html>
