<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="販売価格と原価から利益額・利益率・原価率を計算できる無料ツールです。">
<title>利益率計算機</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}
.box{max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}
h1{text-align:center;font-size:28px;margin:0 0 8px}.lead{text-align:center;color:#666;margin:0 0 24px}
label{display:block;margin:18px 0 8px;font-weight:bold}
input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}
button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}
.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px}
.row{display:flex;justify-content:space-between;gap:16px;margin:12px 0}.value{font-weight:bold}
.main{font-size:30px;font-weight:bold;text-align:center;margin:8px 0 18px}
.note{font-size:13px;color:#666;margin-top:18px;line-height:1.6}
@media(max-width:600px){.box{margin:16px;padding:22px}.main{font-size:27px}}
</style>
</head>
<body>
<div class="box">
<h1>利益率計算機</h1>
<p class="lead">販売価格と原価から利益率を計算</p>
<label>販売価格（円）</label>
<input id="sales" type="number" min="0" step="1" placeholder="例：10000">
<label>原価（円）</label>
<input id="cost" type="number" min="0" step="1" placeholder="例：6000">
<button onclick="calc()">計算する</button>
<div class="result">
<div class="main" id="margin">---</div>
<div class="row"><span>利益額</span><span class="value" id="profit">---</span></div>
<div class="row"><span>原価率</span><span class="value" id="costRate">---</span></div>
<div class="row"><span>利益率（粗利率）</span><span class="value" id="margin2">---</span></div>
</div>
<p class="note">利益率 ＝（販売価格 − 原価）÷ 販売価格 × 100。原価には商品・材料などの直接的な仕入れ費用を入力してください。</p>
</div>
<script>
function fmt(n){return Math.round(n).toLocaleString()+"円"}
function pct(n){return n.toLocaleString(undefined,{maximumFractionDigits:2})+"%"}
function calc(){
 const s=Number(document.getElementById("sales").value),c=Number(document.getElementById("cost").value);
 if(!Number.isFinite(s)||s<=0||!Number.isFinite(c)||c<0){alert("販売価格と原価を正しく入力してください。");return}
 const p=s-c,m=p/s*100,cr=c/s*100;
 document.getElementById("margin").textContent=pct(m);
 document.getElementById("profit").textContent=fmt(p);
 document.getElementById("costRate").textContent=pct(cr);
 document.getElementById("margin2").textContent=pct(m);
}
</script>
</body>
</html>
