<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fuel Cost Calculator</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#1f2937}.wrap{max-width:620px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}h1{font-size:24px}.lead{color:#64748b;line-height:1.6}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}.result{margin-top:18px;padding:18px;background:#f8fafc;border-radius:12px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5e7eb}.err{color:#dc2626;margin-top:10px}</style></head><body><div class="wrap"><div class="card"><h1>Fuel Cost Calculator</h1><p class="lead">Calculate fuel cost from distance, fuel economy, and fuel price.</p><div class="field"><label>Distance (km)</label><input id="a" type="number" min="0"></div><div class="field"><label>Fuel Economy (km/L)</label><input id="b" type="number" min="0"></div><div class="field"><label>Fuel Price (per L)</label><input id="c" type="number" min="0" step="any"></div><button onclick="calc()">Calculate</button><div id="err" class="err"></div><div id="res" class="result" hidden></div></div></div><script>const a=document.getElementById('a'),b=document.getElementById('b'),c=document.getElementById('c'),d=document.getElementById('d'),e=document.getElementById('e');function show(rows){res.innerHTML=rows.map(x=>'<div class="row"><span>'+x[0]+'</span><strong>'+x[1].toLocaleString(undefined,{maximumFractionDigits:2})+(x[0].includes('Percent')?' %':'')+'</strong></div>').join('');res.hidden=false}function calc(){try{const dist=+a.value,eco=+b.value,price=+c.value;if(dist<0||eco<=0||price<0)throw 0;const liters=dist/eco;show([['Fuel Needed (L)',liters],['Estimated Cost',liters*price]]);err.textContent=''}catch(x){err.textContent='Please check your inputs.';res.hidden=true}}</script></body></html>
