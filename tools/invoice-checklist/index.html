<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>請求書チェックリストメーカー｜無料Webツール</title><meta name="description" content="請求書を送る前の確認項目をチェックできる無料ツール。宛名、請求日、支払期限、明細、振込先などの漏れを確認できます。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:800px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}h1{font-size:26px}label{display:block;padding:12px 4px;border-bottom:1px solid #eee}button{padding:10px 15px;border:0;border-radius:7px;background:#333;color:#fff;margin:5px 5px 5px 0;cursor:pointer}.status{font-size:20px;font-weight:700}.done{text-decoration:line-through;color:#888}.result{white-space:pre-wrap;background:#fafafa;border:1px solid #ddd;border-radius:8px;padding:14px;line-height:1.7}</style></head><body><h1>請求書チェックリストメーカー</h1><p>請求書を送る前に、基本的な確認項目をチェックできます。入力内容は送信されません。</p><div class="box"><div class="status" id="status"></div><div id="list"></div><button onclick="allOn()">すべてチェック</button><button onclick="allOff()">すべて解除</button></div><div class="box"><button onclick="copyResult()">チェック結果をコピー</button><div class="result" id="result"></div></div><script>const items=['請求先の会社名・氏名を確認した','請求先の住所・部署・担当者など必要な宛名を確認した','請求日を確認した','支払期限を確認した','請求内容・案件名を確認した','明細の数量・単価・金額を確認した','小計・消費税・合計金額を確認した','振込先の銀行名・支店名・口座番号を確認した','振込手数料の負担者を確認した','請求書番号など必要な管理番号を確認した','添付ファイル名・PDF内容を確認した','送付先メールアドレスを確認した'];items.forEach((x,i)=>list.insertAdjacentHTML('beforeend','<label id="l'+i+'"><input type="checkbox" onchange="render()"> '+x+'</label>'));function render(){let c=[...list.querySelectorAll('input:checked')].length;status.textContent=c+' / '+items.length+' 項目チェック済み';[...list.querySelectorAll('label')].forEach((l,i)=>l.classList.toggle('done',l.querySelector('input').checked));result.textContent='【請求書チェック結果】\n'+items.map((x,i)=>(list.querySelectorAll('input')[i].checked?'✓ ':'□ ')+x).join('\n')}function allOn(){list.querySelectorAll('input').forEach(x=>x.checked=true);render()}function allOff(){list.querySelectorAll('input').forEach(x=>x.checked=false);render()}function copyResult(){navigator.clipboard.writeText(result.textContent);alert('チェック結果をコピーしました。')}render();</script></body></html>
