<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="購入金額と points還元率からCalculate points earned and effective costできる無料ツールです。">
<title>Point Cashback Calculator</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:40px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:28px;margin:0 0 8px}.lead{text-align:center;color:#666;margin:0 0 24px}label{display:block;margin:18px 0 8px;font-weight:bold}input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px}.main{font-size:30px;font-weight:bold;text-align:center;margin:8px 0 18px}.row{display:flex;justify-content:space-between;gap:12px;margin:12px 0}.value{font-weight:bold}.note{font-size:13px;color:#666;line-height:1.6;margin-top:18px}@media(max-width:600px){.box{margin:16px;padding:22px}.main{font-size:27px}}</style></head>
<body><div class="box"><h1> points還元率計算機</h1><p class="lead">獲得 pointsとEffective costを計算</p>
<label>Purchase amount</label><input id="price" type="number" min="0" placeholder="例：10000">
<label>Cashback rate (%)</label><input id="rate" type="number" min="0" step="0.01" placeholder="例：1">
<button onclick="calc()">Calculate</button>
<div class="result"><div class="main" id="points">---</div><div class="row"><span>Cashback value</span><span class="value" id="reward">---</span></div><div class="row"><span>実質負担額</span><span class="value" id="net">---</span></div></div>
<p class="note">This calculator assumes 1 point is worth 1 yen. Actual reward rules and rounding may vary by service.</p></div>
<script>function yen(n){return Math.round(n).toLocaleString()+""}function calc(){const p=Number(document.getElementById("price").value),r=Number(document.getElementById("rate").value);if(!Number.isFinite(p)||p<0||!Number.isFinite(r)||r<0){alert("Please enter a valid purchase amount and cashback rate.");return}const reward=p*r/100,net=p-reward;document.getElementById("points").textContent=reward.toLocaleString(undefined,{maximumFractionDigits:2})+" points";document.getElementById("reward").textContent=yen(reward);document.getElementById("net").textContent=yen(net)}</script></body></html>
