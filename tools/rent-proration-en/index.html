<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rent Proration Calculator</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px}label{display:block;margin-top:16px;font-weight:bold}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:6px}button{margin-top:20px;background:#333;color:#fff;border:0;border-radius:8px}</style><div class="box"><h1>Rent Proration Calculator</h1><label>Monthly Rent</label><input id="r" type="number"><label>Days in Month</label><input id="d" type="number" value="30"><label>Days Used</label><input id="u" type="number"><button onclick="go()">Calculate</button><h2 id="o">—</h2></div><script>function go(){o.textContent=(+r.value/+d.value*+u.value).toLocaleString(undefined,{maximumFractionDigits:0})}</script>
