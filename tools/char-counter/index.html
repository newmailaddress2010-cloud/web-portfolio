<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字数カウンター</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#333}
.container{max-width:700px;margin:50px auto;padding:20px}h1{text-align:center;margin-bottom:25px}
textarea{width:100%;height:300px;padding:15px;font-size:16px;border:1px solid #ccc;border-radius:8px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.stat{background:white;padding:18px;text-align:center;border-radius:8px}
.number{display:block;font-size:28px;font-weight:bold;margin-top:5px}
@media(max-width:600px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>文字数カウンター</h1>
<textarea id="text" placeholder="ここに文章を入力してください"></textarea>
<div class="stats">
<div class="stat">文字数<span class="number" id="characters">0</span></div>
<div class="stat">文字数（空白除く）<span class="number" id="noSpace">0</span></div>
<div class="stat">行数<span class="number" id="lines">0</span></div>
</div>
</div>
<script>
const text=document.getElementById("text");
text.addEventListener("input",()=>{
const value=text.value;
document.getElementById("characters").textContent=value.length;
document.getElementById("noSpace").textContent=value.replace(/\s/g,"").length;
document.getElementById("lines").textContent=value.length?value.split("\n").length:0;
});
</script>
</body>
</html>
