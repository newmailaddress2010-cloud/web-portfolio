<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hourly Wage Calculator</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px}label{display:block;margin-top:16px;font-weight:bold}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:6px}button{margin-top:20px;background:#333;color:white;border:0;border-radius:8px}</style><div class="box"><h1>Hourly Wage Calculator</h1><label>Monthly Pay</label><input id="p" type="number"><label>Work Days per Month</label><input id="d" type="number" value="20"><label>Hours per Day</label><input id="h" type="number" value="8"><button onclick="go()">Calculate</button><h2 id="r">—</h2></div><script>function go(){let P=+p.value,D=+d.value,H=+h.value;r.textContent=P>0&&D>0&&H>0?'Hourly wage: '+Math.round(P/D/H).toLocaleString():'Please enter valid values.'}</script>
