<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="商品の価格と容量から100g・100ml・1個あたりの単価を計算して比較する無料ツール。"><title>単価計算機｜100g・100mlあたりの値段を比較</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><p class="eyebrow">FREE WEB TOOL</p><h1>単価計算機</h1><p class="lead">価格と内容量から単価を計算して、商品を比較できます。</p></header><section class="card"><label>価格<div class="row"><input id="price" type="number" min="0" step="any" placeholder="例：398"><span>円</span></div></label><label>内容量<div class="row"><input id="amount" type="number" min="0" step="any" placeholder="例：450"><span id="unitLabel">g</span></div></label><label>内容量の単位<select id="unit"><option value="g">g</option><option value="ml">ml</option><option value="個">個</option><option value="枚">枚</option></select></label><label>比較する基準<select id="base"><option value="100">100単位あたり</option><option value="1">1単位あたり</option><option value="1000">1000単位あたり</option></select></label><button id="calc">単価を計算</button></section><section id="result" class="card hidden" aria-live="polite"><h2>計算結果</h2><strong id="resultValue">—</strong><p id="summary"></p><button id="copy" class="sub">結果をコピー</button></section><section class="card info"><h2>使い方</h2><p>スーパーなどで、容量の違う商品を同じ基準で比較したいときに使えます。</p><p>価格÷内容量×基準量で単価を計算します。</p></section></main><script src="script.js"></script></body></html>
