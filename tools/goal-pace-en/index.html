<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goal Pace Calculator</title><style>body{font-family:Arial;background:#f5f6f8}.box{max-width:650px;margin:40px auto;padding:24px;background:#fff;border-radius:14px}label{display:block;font-weight:bold;margin-top:14px}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:6px}button{margin-top:18px;background:#222;color:#fff;border:0;border-radius:8px}.r{margin-top:20px;padding:18px;background:#f1f3f5}</style><div class="box"><h1>Goal Pace Calculator</h1><p>Find how much you need to achieve each day to reach a goal.</p><label>Goal</label><input id="g" type="number"><label>Current Value</label><input id="c" type="number"><label>Days Remaining</label><input id="d" type="number"><button onclick="go()">Calculate Required Pace</button><div id="r" class="r"></div></div><script>function go(){let G=+g.value,C=+c.value,D=+d.value;if(D<1){r.textContent='Enter valid values.';return}let rem=G-C;r.innerHTML='Remaining: <b>'+rem+'</b><br>Required per day: <b>'+(rem/D).toFixed(2)+'</b><br>Current progress: '+(G?C/G*100:0).toFixed(1)+'%'}</script>
