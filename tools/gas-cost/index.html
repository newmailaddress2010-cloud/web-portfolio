<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="走行距離と燃費、ガソリン価格からドライブや移動にかかる燃料代を計算します。"><title>ガソリン代計算機｜燃費から交通費を計算</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><p class="eyebrow">FREE WEB TOOL</p><h1>ガソリン代計算機</h1><p class="lead">走行距離・燃費・ガソリン価格から、必要なガソリン代を計算します。</p></header><section class="card"><label>走行距離<div class="row"><input id="distance" type="number" min="0" step="any" placeholder="例：120"><span>km</span></div></label><label>燃費<div class="row"><input id="efficiency" type="number" min="0.1" step="any" placeholder="例：15"><span>km/L</span></div></label><label>ガソリン価格<div class="row"><input id="price" type="number" min="0" step="any" placeholder="例：175"><span>円/L</span></div></label><button id="calc">計算する</button></section><section id="result" class="card hidden" aria-live="polite"><h2>計算結果</h2><div class="grid"><div><span>必要なガソリン</span><strong id="liters">—</strong></div><div><span>ガソリン代</span><strong id="cost">—</strong></div></div><p id="summary"></p><button id="copy" class="sub">結果をコピー</button></section><section class="card info"><h2>使い方</h2><p>往復なら走行距離に往復分の距離を入力してください。</p><p>実際の燃費や価格によって結果は変わるため、目安としてご利用ください。</p></section></main><script src="script.js"></script></body></html>
