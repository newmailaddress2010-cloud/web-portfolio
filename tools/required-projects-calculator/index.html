<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>必要案件数計算機｜目標売上から逆算</title><style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:auto;padding:20px;background:#f6f7f9;color:#222;line-height:1.6}main{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 12px #0001}h1{font-size:24px;margin-top:0}.lead{color:#555}label{display:block;margin-top:16px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}button{margin-top:20px;padding:12px 18px;border:0;border-radius:8px;background:#333;color:#fff;font-size:16px}.result{margin-top:22px;padding:18px;background:#f0f3f6;border-radius:10px}.big{font-size:30px;font-weight:700}.note{font-size:13px;color:#666;margin-top:16px}</style></head><body><main><h1>必要案件数計算機</h1><p class="lead">目標売上と平均案件単価から、月に何件の仕事が必要かを逆算します。</p>
<label>目標月間売上（円）<input id="target" type="number" min="0" value="300000"></label><label>平均案件単価（円）<input id="price" type="number" min="1" value="50000"></label><label>1か月の稼働可能日数（日）<input id="days" type="number" min="1" value="20"></label><label>1案件あたりの平均作業時間（時間）<input id="hours" type="number" min="0" step="0.1" value="5"></label><button onclick="calc()">計算する</button><div id="result" class="result"></div><p class="note">単純な売上目標からの概算です。キャンセル、値引き、経費、税金、営業・事務時間などは含みません。</p></main><script>
function n(id){return Number(document.getElementById(id).value)||0}function yen(x){return Math.round(x).toLocaleString("ja-JP")+"円"}function calc(){const t=n("target"),p=n("price"),d=n("days"),h=n("hours"),r=document.getElementById("result");if(t<=0||p<=0||d<=0||h<0){r.textContent="入力値を確認してください。";return}const jobs=Math.ceil(t/p),daily=jobs/d,totalH=jobs*h;r.innerHTML="<div>必要な案件数</div><div class='big'>月 "+jobs+" 件</div><div>案件単価："+yen(p)+"</div><div>1日あたり：約 "+daily.toFixed(2)+" 件</div><div>案件だけに必要な作業時間：約 "+totalH.toFixed(1)+" 時間/月</div><div>平均案件単価を "+yen(p*1.1)+" にすると：約 "+Math.ceil(t/(p*1.1))+" 件/月</div>"}calc();
</script></body></html>
