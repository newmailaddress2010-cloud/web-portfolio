<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>パーセント計算機</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:27px}label{display:block;margin:18px 0 8px;font-weight:bold}input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px}.result p{font-size:18px}.answer{font-size:27px;font-weight:bold}</style></head>
<body><div class="box"><h1>パーセント計算機</h1><label>数値</label><input id="num" type="number" placeholder="例：30"><label>基準となる数値</label><input id="base" type="number" placeholder="例：200"><button onclick="calc()">計算する</button><div class="result"><p><span id="numText">---</span> は <span id="baseText">---</span> の</p><div class="answer" id="rate">---</div><p>です。</p></div></div>
<script>function calc(){const n=Number(document.getElementById("num").value),b=Number(document.getElementById("base").value);if(!Number.isFinite(n)||!Number.isFinite(b)||b===0){alert("数値を正しく入力してください。");return}const r=n/b*100;document.getElementById("numText").textContent=n.toLocaleString();document.getElementById("baseText").textContent=b.toLocaleString();document.getElementById("rate").textContent=r.toLocaleString(undefined,{maximumFractionDigits:4})+"%"}</script></body></html>
