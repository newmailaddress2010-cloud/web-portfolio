<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message Maker</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:700px;margin:40px auto;padding:24px;background:#fff;border-radius:14px}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px}textarea{height:220px}button{background:#333;color:#fff;border:0;border-radius:8px}</style><div class="box"><h1>Message Maker</h1><p>Create a simple polite message from the information you enter.</p><input id="name" placeholder="Recipient name"><input id="purpose" placeholder="Purpose / topic"><textarea id="detail" placeholder="Details"></textarea><button onclick="go()">Create Message</button><textarea id="o"></textarea></div><script>function go(){o.value=(name.value?name.value+'\n\n':'')+'Hello,\n\nI am contacting you regarding '+(purpose.value||'this matter')+'.\n\n'+(detail.value||'Thank you for your time.')+'\n\nBest regards.'}</script>
