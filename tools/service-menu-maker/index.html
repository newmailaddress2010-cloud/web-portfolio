<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サービス料金表メーカー｜無料Webツール</title><meta name="description" content="サービスのプラン名、料金、内容を入力して料金表を作成できる無料ツール。掲載用の文章をコピーできます。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:900px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}input,textarea{width:100%;box-sizing:border-box;padding:9px;margin-top:5px;border:1px solid #ccc;border-radius:6px}textarea{min-height:100px}button{padding:10px 14px;border:0;border-radius:7px;background:#333;color:#fff;margin:4px;cursor:pointer}.card{border:1px solid #ccc;border-radius:8px;padding:14px;margin:10px 0}.price{font-size:22px;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><h1>サービス料金表メーカー</h1><p>3つまでの料金プランを入力すると、掲載用の料金表文章を作成します。入力データは送信されません。</p><div class="box"><div class="grid"><label>サービス名<input id="service" placeholder="例：ホームページ制作"></label><label>表記<input id="unit" value="円"></label><label>備考<input id="note" placeholder="例：修正2回まで"></label></div></div><div id="plans"></div><div class="box"><button onclick="copyResult()">掲載用文章をコピー</button><button onclick="resetAll()">リセット</button></div><div class="box"><h2>プレビュー</h2><div id="preview"></div></div><script>for(let i=1;i<=3;i++)plans.insertAdjacentHTML('beforeend','<div class="box"><h2>プラン'+i+'</h2><label>プラン名<input class="pn" placeholder="例：ライト"></label><label>料金<input class="pp" type="number" min="0" placeholder="30000"></label><label>内容<textarea class="pd" placeholder="・トップページ1ページ\n・スマホ対応\n・お問い合わせフォーム"></textarea></label></div>');document.querySelectorAll('input,textarea').forEach(x=>x.addEventListener('input',render));function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function render(){let n=service.value||'サービス',u=unit.value||'円',ns=[...document.querySelectorAll('.pn')],ps=[...document.querySelectorAll('.pp')],ds=[...document.querySelectorAll('.pd')];preview.innerHTML='<h3>'+esc(n)+'</h3>'+ns.map((x,i)=>'<div class="card"><div>'+esc(x.value||'プラン'+(i+1))+'</div><div class="price">'+(ps[i].value?Number(ps[i].value).toLocaleString()+' '+esc(u):'料金を入力')+'</div><div>'+esc(ds[i].value).replaceAll('\n','<br>')+'</div></div>').join('')+(note.value?'<p>備考：'+esc(note.value)+'</p>':'')}function copyResult(){let n=service.value||'サービス',u=unit.value||'円',ns=[...document.querySelectorAll('.pn')],ps=[...document.querySelectorAll('.pp')],ds=[...document.querySelectorAll('.pd')],o='【'+n+' 料金表】\n\n';ns.forEach((x,i)=>{o+=(x.value||'プラン'+(i+1))+'\n'+(ps[i].value?Number(ps[i].value).toLocaleString()+' '+u:'料金未設定')+'\n'+(ds[i].value?ds[i].value+'\n':'')+'\n'});if(note.value)o+='備考：'+note.value;navigator.clipboard.writeText(o);alert('掲載用文章をコピーしました。')}function resetAll(){document.querySelectorAll('input,textarea').forEach(x=>x.value=x.id==='unit'?'円':'');render()}render();</script></body></html>
