<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Date Difference Calculator</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:28px}label{display:block;margin:18px 0 8px;font-weight:bold}input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.hint{font-size:13px;color:#666;margin-top:7px}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px;text-align:center}.main{font-size:30px;font-weight:bold}</style></head>
<body><div class="box"><h1>Date Difference Calculator</h1><label>開始 days</label><input id="start" type="text" inputmode="numeric" maxlength="8" placeholder="例：20260925"><div class="hint">Enter as YYYYMMDD.</div><label>終了 days</label><input id="end" type="text" inputmode="numeric" maxlength="8" placeholder="例：20261001"><div class="hint">Enter as YYYYMMDD.</div><button onclick="calc()">Calculate Difference</button><div class="result"><div class="main" id="result">---</div><p id="detail">Enter two dates.</p></div></div>
<script>
function parseDate(v){v=v.replace(/[^0-9]/g,"");if(v.length!==8)return null;const y=Number(v.slice(0,4)),m=Number(v.slice(4,6)),d=Number(v.slice(6,8));const x=new Date(y,m-1,d);if(y<1||m<1||m>12||d<1||x.getFullYear()!==y||x.getMonth()!==m-1||x.getDate()!==d)return null;return x}
function calc(){const a=parseDate(document.getElementById("start").value),b=parseDate(document.getElementById("end").value);if(!a||!b){alert(" days付をYYYYMMDDの8桁で正しく入力してください。\n例：20260925");return}const days=Math.round(Math.abs(b-a)/86400000);document.getElementById("result").textContent=days+" days";document.getElementById("detail").textContent="両端の daysを含める場合："+(days+1)+" days"}
</script></body></html>
