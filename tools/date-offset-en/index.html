<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Offset Calculator</title><style>body{font-family:Arial;background:#f5f7fa}.box{max-width:600px;margin:40px auto;padding:24px;background:#fff;border-radius:14px}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px}button{background:#333;color:white;border:0;border-radius:8px}.r{text-align:center;margin-top:20px;font-size:25px;font-weight:bold}</style><div class="box"><h1>Date Offset Calculator</h1><p>Find a date a certain number of days before or after a date.</p><input id="b" type="date"><input id="n" type="number" value="7" min="0"><button onclick="go(-1)">N Days Before</button><button onclick="go(1)">N Days After</button><div id="r" class="r"></div></div><script>b.value=new Date().toISOString().slice(0,10);function go(s){let d=new Date(b.value+"T00:00:00");d.setDate(d.getDate()+s*Number(n.value));r.textContent=d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</script>
