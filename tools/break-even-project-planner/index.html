<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案件損益分岐点プランナー｜無料Webツール</title><meta name="description" content="案件の固定費、1件あたりの変動費、販売価格から損益分岐点となる必要件数を計算できます。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:600}input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px}.result{font-size:19px;line-height:2}.big{font-size:30px;font-weight:700}button{padding:10px 15px;border:0;border-radius:7px;background:#333;color:#fff;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><h1>案件損益分岐点プランナー</h1><p>「何件受注すれば、この案件の固定費を回収できるか」を確認します。</p><div class="box"><div class="grid"><label>固定費（円）<input id="fixed" type="number" min="0" value="100000"></label><label>1件の販売価格（円）<input id="price" type="number" min="0" value="30000"></label><label>1件あたり変動費（円）<input id="variable" type="number" min="0" value="5000"></label></div></div><div class="box"><div class="result">1件あたりの限界利益：<span id="margin"></span> 円<br>損益分岐点売上：<span id="sales"></span> 円<br>必要受注件数：<span class="big" id="count"></span> 件</div><button onclick="copyResult()">結果をコピー</button></div><script>['fixed','price','variable'].forEach(id=>document.getElementById(id).addEventListener('input',calc));function n(id){return +document.getElementById(id).value||0}function calc(){let f=n('fixed'),p=n('price'),v=n('variable'),m=p-v,c=m>0?Math.ceil(f/m):0;margin.textContent=Math.round(m).toLocaleString();count.textContent=c;sales.textContent=(c*p).toLocaleString()}function copyResult(){let t='【案件損益分岐点】\n1件あたりの限界利益：'+margin.textContent+'円\n損益分岐点売上：'+sales.textContent+'円\n必要受注件数：'+count.textContent+'件';navigator.clipboard.writeText(t);alert('結果をコピーしました。')}calc();</script></body></html>
