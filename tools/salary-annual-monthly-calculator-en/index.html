<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annual Salary / Monthly Salary Calculator</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#1f2937}.wrap{max-width:620px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}h1{font-size:24px}.lead{color:#64748b;line-height:1.6}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}.result{margin-top:18px;padding:18px;background:#f8fafc;border-radius:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e5e7eb}.row:last-child{border:0}.err{color:#dc2626;margin-top:10px}</style></head><body><div class="wrap"><div class="card"><h1>Annual / Monthly Salary Calculator</h1><p class="lead">Convert annual salary to monthly salary, or monthly salary to annual salary.</p><div class="field"><label>Amount</label><input id="amount" type="number" min="0" step="any" placeholder="3600000"></div><div class="field"><label>計算方向</label><select id="mode" style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px"><option value="annual">Annual → Monthly</option><option value="monthly">Monthly → Annual</option></select></div><button onclick="calc()">Calculate</button><div id="err" class="err"></div><div id="res" class="result" hidden><div class="row"><span id="label"></span><strong id="out"></strong></div><div class="row"><span>Formula</span><span id="formula"></span></div></div></div></div><script>function calc(){const a=Number(document.getElementById('amount').value),m=document.getElementById('mode').value,e=document.getElementById('err'),r=document.getElementById('res');if(!Number.isFinite(a)||a<0){e.textContent='Enter an amount of 0 or more.';r.hidden=true;return}e.textContent='';r.hidden=false;if(m==='annual'){document.getElementById('label').textContent='Monthly (÷12)';document.getElementById('out').textContent=(a/12).toLocaleString('ja-JP',{maximumFractionDigits:2})+' ';document.getElementById('formula').textContent=a.toLocaleString('ja-JP')+' ÷ 12'}else{document.getElementById('label').textContent='Annual (×12)';document.getElementById('out').textContent=(a*12).toLocaleString('ja-JP',{maximumFractionDigits:2})+' 円';document.getElementById('formula').textContent=a.toLocaleString('ja-JP')+' × 12'}}</script></body></html>
