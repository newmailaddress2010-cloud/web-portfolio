<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculate sleep duration from bedtime and wake-up time.</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#1f2937}.wrap{max-width:620px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}h1{font-size:24px}.lead{color:#64748b;line-height:1.6}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}.result{margin-top:18px;padding:18px;background:#f8fafc;border-radius:12px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5e7eb}.err{color:#dc2626;margin-top:10px}</style></head><body><div class="wrap"><div class="card"><h1>Calculate sleep duration from bedtime and wake-up time.</h1><p class="lead">就寝時刻</p><div class="field"><label>Bedtime</label><input id="a" type="time"></div><div class="field"><label>Wake-up Time</label><input id="b" type="time"></div><button onclick="calc()">Calculate</button><div id="err" class="err"></div><div id="res" class="result" hidden></div></div></div><script>const a=document.getElementById('a'),b=document.getElementById('b'),res=document.getElementById('res'),err=document.getElementById('err');function calc(){if(!a.value||!b.value){err.textContent='Enter both times.';return}let x=a.value.split(':').map(Number),y=b.value.split(':').map(Number),m=x[0]*60+x[1],n=y[0]*60+y[1];if(n<=m)n+=1440;let z=n-m;res.innerHTML='<div class="row"><span>Sleep Duration</span><strong>'+Math.floor(z/60)+' h '+z%60+' min</strong></div>';res.hidden=false}</script></body></html>
