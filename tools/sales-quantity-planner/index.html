<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="商品やサービスの売上目標と平均単価から、必要な販売件数を計算する無料ツールです。">
<title>売上目標・必要件数計算機</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#243044;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.65}
main{width:min(100% - 28px,820px);margin:30px auto}h1{font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.3;margin:0 0 10px}h2{font-size:1.15rem;margin:0 0 14px}p{color:#657287;margin:8px 0}
.panel{background:#fff;border:1px solid #dce3ec;border-radius:15px;padding:clamp(16px,3vw,25px);margin:16px 0;box-shadow:0 5px 20px #24304408}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{min-width:0}label{display:block;font-weight:650;font-size:.92rem;margin-bottom:6px}input,select{width:100%;min-width:0;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:#fff;color:inherit}
button{font:inherit;font-weight:650;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;background:#315ea8;color:#fff}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}.actions button{flex:1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{background:#f6f8fb;border:1px solid #e2e8f0;border-radius:11px;padding:15px;min-width:0}.stat span{display:block;color:#657287;font-size:.88rem}.stat strong{display:block;font-size:clamp(1.2rem,3vw,1.7rem);overflow-wrap:anywhere;margin-top:5px}
.result-note{background:#f6f8fb;border-radius:10px;padding:13px;margin-top:14px}.note{font-size:.88rem}footer{text-align:center;color:#657287;font-size:.85rem;padding:10px 0 26px}
@media(max-width:560px){main{margin:20px auto}.grid,.stats{grid-template-columns:1fr}.actions button{flex:1 1 100%}}
</style>
</head>
<body>
<main>
<header>
<h1>売上目標・必要件数計算機</h1>
<p>月の売上目標と平均販売単価から、必要な販売件数を計算します。サービス販売、ネットショップ、フリーランスの売上計画などにご利用ください。</p>
</header>
<section class="panel">
<h2>目標と単価を入力</h2>
<div class="grid">
<div class="field"><label for="goal">目標売上（円）</label><input id="goal" type="number" min="0" step="1" value="100000" placeholder="例：100000"></div>
<div class="field"><label for="price">平均販売単価（円）</label><input id="price" type="number" min="0" step="1" value="3000" placeholder="例：3000"></div>
<div class="field"><label for="current">現在の販売件数（任意）</label><input id="current" type="number" min="0" step="1" value="0" placeholder="例：10"></div>
<div class="field"><label for="period">目標の期間</label><select id="period"><option value="月">1か月</option><option value="週">1週間</option><option value="日">1日</option><option value="年">1年間</option></select></div>
</div>
<div class="actions"><button type="button" id="calc">必要件数を計算</button><button type="button" id="reset" style="background:#e9eef6;color:#243044">初期値に戻す</button></div>
</section>
<section class="panel">
<h2>計算結果</h2>
<div class="stats">
<div class="stat"><span>目標達成に必要な件数</span><strong id="needed">34件</strong></div>
<div class="stat"><span>必要な売上金額</span><strong id="revenue">102,000円</strong></div>
<div class="stat"><span>現在から追加で必要な件数</span><strong id="extra">34件</strong></div>
<div class="stat"><span>目標を超える金額</span><strong id="over">2,000円</strong></div>
</div>
<div class="result-note" id="explanation" aria-live="polite">目標売上を達成するための販売件数を表示します。</div>
<p class="note">必要件数は端数を切り上げています。売上目標の計算であり、手数料・原価・税金などを差し引いた利益ではありません。利益目標を立てる場合は、それらの費用も考慮してください。</p>
</section>
<footer>売上目標・必要件数計算機｜無料ツール</footer>
</main>
<script>
const $=id=>document.getElementById(id);
function money(n){return Math.round(n).toLocaleString('ja-JP')+'円';}
function calculate(){
 const goal=Number($('goal').value),price=Number($('price').value),current=Number($('current').value),period=$('period').value;
 if($('goal').value.trim()===''||$('price').value.trim()===''||!Number.isFinite(goal)||!Number.isFinite(price)||!Number.isFinite(current)||goal<0||price<=0||current<0){alert('目標売上は0以上、平均販売単価は1以上、現在の件数は0以上で入力してください。');return;}
 const needed=Math.ceil(goal/price),revenue=needed*price,extra=Math.max(0,needed-current),over=revenue-goal;
 $('needed').textContent=needed.toLocaleString('ja-JP')+'件';
 $('revenue').textContent=money(revenue);
 $('extra').textContent=extra.toLocaleString('ja-JP')+'件';
 $('over').textContent=money(over);
 $('explanation').textContent=goal===0?'目標売上が0円のため、必要な販売件数は0件です。':period+'の売上目標 '+money(goal)+' を達成するには、平均 '+money(price)+' の商品・サービスを '+needed.toLocaleString('ja-JP')+'件販売する必要があります。';
}
$('calc').addEventListener('click',calculate);
['goal','price','current','period'].forEach(id=>$(id).addEventListener('input',calculate));
$('reset').addEventListener('click',()=>{$('goal').value=100000;$('price').value=3000;$('current').value=0;$('period').value='月';calculate();});
calculate();
</script>
</body>
</html>
