<!doctype html><html lang="en><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Turnover Calculator</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#1f2937}.wrap{max-width:620px;margin:auto;padding:24px 16px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}h1{font-size:24px}.lead{color:#64748b;line-height:1.6}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:16px;font-weight:700}.result{margin-top:18px;padding:18px;background:#f8fafc;border-radius:12px}.result strong{display:block;font-size:28px;margin-top:6px}.err{color:#dc2626;margin-top:10px}</style><body><div class="wrap"><div class="card"><h1>Inventory Turnover Calculator</h1><p class="lead">Calculate inventory turnover.</p><div class="field"><label>COGS</label><input id="x0" type="number" min="0" step="any" placeholder="1000000"></div><div class="field"><label>Average inventory</label><input id="x1" type="number" min="0" step="any" placeholder="250000"></div><button onclick="calc()">Calculate</button><div id="err" class="err"></div><div id="res" class="result" hidden>Result<strong id="out"></strong></div></div></div><script>function n(i){return Number(document.getElementById('x'+i).value)||0}function calc(){let v,u;v=n(0)/n(1);u='turns';let e=!isFinite(v)||v<0;document.getElementById('err').textContent=e?'Please check your inputs.':'';document.getElementById('res').hidden=e;if(!e)document.getElementById('out').textContent=v.toLocaleString('en-US',{maximumFractionDigits:2})+' '+(u==='%'?'%':u==='turns'?'回': 'JPY')}</script>
