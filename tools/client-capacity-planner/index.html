<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案件受注可能数プランナー｜無料Webツール</title><meta name="description" content="月の稼働可能時間、1案件の作業時間、予備時間を入力して、受注可能な案件数の目安を計算できます。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:600}input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px}.result{line-height:2;font-size:19px}.big{font-size:30px;font-weight:700}button{padding:10px 15px;border:0;border-radius:7px;background:#333;color:#fff;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><h1>案件受注可能数プランナー</h1><p>「月に何件まで受けられるか」を、作業時間と予備時間から確認します。</p><div class="box"><div class="grid"><label>月の稼働可能時間<input id="available" type="number" min="0" step=".5" value="60"></label><label>1案件の作業時間<input id="per" type="number" min="0.1" step=".5" value="10"></label><label>予備時間（%）<input id="buffer" type="number" min="0" max="90" value="20"></label><label>すでに確保済みの時間<input id="used" type="number" min="0" step=".5" value="0"></label></div></div><div class="box"><div class="result">実際に案件へ使える時間：<span id="usable"></span> 時間<br>理論上の受注可能数：<span class="big" id="count"></span> 件<br>余る時間：<span id="remain"></span> 時間</div><button onclick="copyResult()">結果をコピー</button></div><script>['available','per','buffer','used'].forEach(id=>document.getElementById(id).addEventListener('input',calc));function n(id){return +document.getElementById(id).value||0}function calc(){let a=Math.max(0,n('available')-n('used')),u=a*(1-n('buffer')/100),p=n('per'),c=p?Math.floor(u/p):0;usable.textContent=u.toFixed(1);count.textContent=c;remain.textContent=Math.max(0,u-c*p).toFixed(1)}function copyResult(){let t='【案件受注可能数】\n案件へ使える時間：'+usable.textContent+'時間\n受注可能数：'+count.textContent+'件\n余る時間：'+remain.textContent+'時間';navigator.clipboard.writeText(t);alert('結果をコピーしました。')}calc();</script></body></html>
