<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>文章から日付を拾うツール</title><style>body{font-family:Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#f6f7f9;color:#333;margin:0}.wrap{max-width:720px;margin:40px auto;padding:24px}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08)}textarea,button{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc}textarea{min-height:220px}button{background:#333;color:#fff;margin-top:14px}.result{margin-top:20px;padding:16px;background:#f1f3f5;border-radius:10px;line-height:1.8}</style></head><body><div class="wrap"><div class="card"><h1>文章から日付を拾うツール</h1><p>メールや案内文を貼り付けると、文章中の日付を一覧にします。</p><textarea id="text" placeholder="例：申込期限は2026年10月5日です。9月30日までに返信してください。"></textarea><button onclick="go()">日付を拾う</button><div id="result" class="result">—</div></div></div><script>function go(){const t=document.getElementById("text").value;if(!t.trim()){result.textContent="文章を入力してください";return}const p=[/\d{4}年\d{1,2}月\d{1,2}日/g,/\d{1,2}月\d{1,2}日/g,/\d{4}[./-]\d{1,2}[./-]\d{1,2}/g,/\d{8}/g];let a=[];for(const r of p)a.push(...(t.match(r)||[]));a=[...new Set(a)];result.innerHTML=a.length?a.map((x,i)=>(i+1)+". "+x).join("<br>"):"日付らしい表現が見つかりませんでした"}</script></body></html>
