<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tax Calculator</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px}label{display:block;margin-top:16px;font-weight:bold}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:6px}button{margin-top:20px;background:#333;color:#fff;border:0;border-radius:8px}</style><div class="box"><h1>Tax Calculator</h1><label>Amount</label><input id="a" type="number"><label>Tax Rate (%)</label><input id="r" type="number" value="10"><button onclick="go()">Calculate</button><h2 id="o">—</h2></div><script>function go(){let A=+a.value,R=+r.value,t=A*R/100;o.innerHTML='Tax: '+Math.round(t).toLocaleString()+'<br>Total: '+Math.round(A+t).toLocaleString()}</script>
