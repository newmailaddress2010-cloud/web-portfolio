<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会議コスト計算機｜無料Webツール</title><meta name="description" content="参加人数、1人あたりの時間単価、会議時間から会議コストの目安を計算できる無料ツールです。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:600}input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px}.result{font-size:20px;line-height:2}.big{font-size:30px;font-weight:700}button{padding:10px 15px;border:0;border-radius:7px;background:#333;color:#fff;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><h1>会議コスト計算機</h1><p>会議に参加する人数、1人あたりの時間単価、会議時間から人件費ベースの会議コストを計算します。</p><div class="box"><div class="grid"><label>参加人数<input id="people" type="number" min="1" value="4"></label><label>1人あたり時間単価（円）<input id="rate" type="number" min="0" value="3000"></label><label>会議時間（分）<input id="minutes" type="number" min="0" value="60"></label></div></div><div class="box"><div class="result">総参加時間：<span id="hours"></span> 時間<br>会議コスト：<span class="big" id="cost"></span> 円</div><button onclick="copyResult()">結果をコピー</button></div><script>['people','rate','minutes'].forEach(id=>document.getElementById(id).addEventListener('input',calc));function n(id){return +document.getElementById(id).value||0}function calc(){let h=n('people')*n('minutes')/60,c=h*n('rate');hours.textContent=h.toFixed(2);cost.textContent=Math.round(c).toLocaleString()}function copyResult(){let t='【会議コスト】\n参加人数：'+n('people')+'人\n会議時間：'+n('minutes')+'分\n会議コスト：'+cost.textContent+'円';navigator.clipboard.writeText(t);alert('結果をコピーしました。')}calc();</script></body></html>
