<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>税込・税抜計算機</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:28px}label{display:block;margin:18px 0 8px;font-weight:bold}input,select,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.result{margin-top:24px;padding:18px;background:#f7f7f7;border-radius:10px}.result p{font-size:18px}
</style></head><body><div class="box"><h1>税込・税抜計算機</h1><label>税込金額</label><input id="price" type="number" min="0" placeholder="例：11000"><label>消費税率</label><select id="rate"><option value="10">10%</option><option value="8">8%</option><option value="5">5%</option><option value="3">3%</option><option value="1">1%</option></select><button onclick="calc()">計算する</button><div class="result"><p>税抜金額：<strong id="before">---</strong> 円</p><p>消費税額：<strong id="tax">---</strong> 円</p><p>税込金額：<strong id="after">---</strong> 円</p></div></div>
<script>function calc(){const p=Number(document.getElementById("price").value),r=Number(document.getElementById("rate").value);if(p<0||!document.getElementById("price").value){alert("金額を入力してください。");return}const b=Math.floor(p/(1+r/100));document.getElementById("before").textContent=b.toLocaleString();document.getElementById("tax").textContent=(p-b).toLocaleString();document.getElementById("after").textContent=p.toLocaleString()}</script></body></html>
