<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mortgage Payment Calculator</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7fb;color:#1f2937}.wrap{max-width:620px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 18px #0001}h1{font-size:24px}.lead{color:#64748b;line-height:1.6}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;font-weight:700}.result{margin-top:18px;padding:18px;background:#f8fafc;border-radius:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e5e7eb}.row:last-child{border:0}.err{color:#dc2626;margin-top:10px}.note{font-size:13px;color:#64748b;margin-top:14px}</style></head><body><div class="wrap"><div class="card"><h1>Mortgage Payment Calculator</h1><p class="lead">Estimate monthly payments and total repayment from loan amount, interest rate, and term.</p><div class="field"><label>Loan Amount</label><input id="p" type="number" min="0" step="any" placeholder="300000"></div><div class="field"><label>Annual Interest Rate (%)</label><input id="r" type="number" min="0" step="any" placeholder="6"></div><div class="field"><label>Loan Term (years)</label><input id="y" type="number" min="1" step="1" placeholder="30"></div><button onclick="calc()">Calculate</button><div id="err" class="err"></div><div id="res" class="result" hidden><div class="row"><span>Monthly Payment</span><strong id="m"></strong></div><div class="row"><span>Total Repayment</span><span id="t"></span></div><div class="row"><span>Total Interest</span><span id="i"></span></div></div><p class="note">Estimate based on equal monthly payments. Fees, extra payments, and rate changes are not included.</p></div></div><script>function calc(){const p=Number(document.getElementById('p').value),r=Number(document.getElementById('r').value),y=Number(document.getElementById('y').value),e=document.getElementById('err'),res=document.getElementById('res');if(!Number.isFinite(p)||!Number.isFinite(r)||!Number.isFinite(y)||p<=0||r<0||y<=0){e.textContent='Enter a loan amount above 0, an interest rate of 0 or more, and a term above 0.';res.hidden=true;return}const n=y*12,rate=r/100/12;let m;if(rate===0)m=p/n;else m=p*rate*Math.pow(1+rate,n)/(Math.pow(1+rate,n)-1);const t=m*n,i=t-p;e.textContent='';res.hidden=false;document.getElementById('m').textContent=Math.round(m).toLocaleString('en-US');document.getElementById('t').textContent=Math.round(t).toLocaleString('en-US');document.getElementById('i').textContent=Math.round(i).toLocaleString('en-US')}</script></body></html>
