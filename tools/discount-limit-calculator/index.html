<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>値引き限界計算機｜目標利益率を守る</title><style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:auto;padding:20px;background:#f6f7f9;color:#222;line-height:1.6}main{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 12px #0001}h1{font-size:24px;margin-top:0}.lead{color:#555}label{display:block;margin-top:16px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}button{margin-top:20px;padding:12px 18px;border:0;border-radius:8px;background:#333;color:#fff;font-size:16px}.result{margin-top:22px;padding:18px;background:#f0f3f6;border-radius:10px}.big{font-size:30px;font-weight:700}.warn{margin-top:12px;font-weight:600}.note{font-size:13px;color:#666;margin-top:16px}</style></head><body><main><h1>値引き限界計算機</h1><p class="lead">「ここまで値引きしても大丈夫？」を、原価と目標利益率から逆算します。</p>
<label>通常価格（円）<input id="price" type="number" min="0" value="50000"></label><label>原価（円）<input id="cost" type="number" min="0" value="20000"></label><label>最低限確保したい利益率（%）<input id="margin" type="number" min="0" max="99.9" step="0.1" value="30"></label><button onclick="calc()">計算する</button><div id="result" class="result"></div><p class="note">利益率＝（販売価格−原価）÷販売価格。税金、決済手数料、固定費などは含めていません。実際の価格判断では、それらの費用も確認してください。</p>
</main><script>function n(id){return Number(document.getElementById(id).value)||0}function yen(x){return Math.round(x).toLocaleString("ja-JP")+"円"}function calc(){const p=n("price"),c=n("cost"),m=n("margin")/100;const r=document.getElementById("result");if(p<=0||c<0||m>=1){r.textContent="入力値を確認してください。";return}const min=c/(1-m),max=Math.max(0,p-min),rate=max/p*100,current=(p-c)/p*100;r.innerHTML="<div>目標利益率を守れる最低価格</div><div class='big'>"+yen(min)+"</div><div>最大値引き額："+yen(max)+"</div><div>最大値引き率："+rate.toFixed(1)+"%</div><div>現在の利益率："+current.toFixed(1)+"%</div>"+(p<min?"<div class='warn'>通常価格の時点で目標利益率を下回っています。</div>":"")}calc();</script></body></html>
