<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>制作見積もり内訳メーカー｜無料Webツール</title><meta name="description" content="Web制作やデザインなどの見積もり内訳を作成できる無料ツール。項目、数量、単価を入力して小計・消費税・合計を計算。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:1000px;margin:auto;padding:20px;background:#f6f7f9;color:#222}h1{font-size:26px}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin:14px 0}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px}input,select{box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px;width:100%}button{padding:9px 14px;border:0;border-radius:7px;background:#333;color:#fff;cursor:pointer;margin:4px 4px 4px 0}.sub{background:#777}.num{max-width:130px}.summary{text-align:right;font-size:18px}.total{font-size:24px;font-weight:700}@media(max-width:650px){table{font-size:13px}}</style></head><body><h1>制作見積もり内訳メーカー</h1><p>Web制作・デザイン・事務作業などの見積もり内訳を作成できます。入力内容はこのブラウザ内だけで処理します。</p><div class="box">消費税率 <select id="tax"><option value=".1">10%</option><option value=".08">8%</option><option value="0">なし</option></select></div><div class="box"><table><thead><tr><th>項目</th><th>数量</th><th>単価</th><th>金額</th><th></th></tr></thead><tbody id="rows"></tbody></table><button onclick="addRow()">＋項目を追加</button></div><div class="box summary"><div>小計：<span id="sub">0</span> 円</div><div>消費税：<span id="taxv">0</span> 円</div><div class="total">合計：<span id="total">0</span> 円</div><button onclick="copyText()">見積もりをコピー</button><button class="sub" onclick="downloadCsv()">CSV保存</button></div><script>const rows=document.getElementById('rows');function addRow(){let tr=document.createElement('tr');tr.innerHTML='<td><input class="name" placeholder="例：トップページ制作"></td><td><input class="qty" type="number" min="0" step=".01" value="1"></td><td><input class="price" type="number" min="0" value="0"></td><td class="amount">0</td><td><button class="sub" onclick="this.closest(\'tr\').remove();calc()">削除</button></td>';rows.appendChild(tr);tr.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc()}function yen(n){return Math.round(n).toLocaleString('ja-JP')}function data(){return [...rows.querySelectorAll('tr')].map(tr=>[tr.querySelector('.name').value,tr.querySelector('.qty').value,tr.querySelector('.price').value,Math.round((+tr.querySelector('.qty').value||0)*(+tr.querySelector('.price').value||0))])}function calc(){let s=0;rows.querySelectorAll('tr').forEach(tr=>{let a=(+tr.querySelector('.qty').value||0)*(+tr.querySelector('.price').value||0);tr.querySelector('.amount').textContent=yen(a);s+=a});let t=Math.round(s*(+tax.value||0));sub.textContent=yen(s);taxv.textContent=yen(t);total.textContent=yen(s+t)}function copyText(){let d=data(),s=d.reduce((a,r)=>a+r[3],0),t=Math.round(s*(+tax.value||0));navigator.clipboard.writeText('【見積もり内訳】\n'+d.filter(r=>r[0]).map(r=>r[0]+'　'+r[1]+' × '+yen(+r[2])+'円 = '+yen(r[3])+'円').join('\n')+'\n小計：'+yen(s)+'円\n消費税：'+yen(t)+'円\n合計：'+yen(s+t)+'円');alert('見積もりをコピーしました。')}function downloadCsv(){let csv='項目,数量,単価,金額\n'+data().map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='見積もり内訳.csv';a.click()}tax.addEventListener('change',calc);for(let i=0;i<5;i++)addRow();</script></body></html>
