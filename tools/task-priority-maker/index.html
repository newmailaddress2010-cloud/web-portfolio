<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仕事タスク優先順位メーカー｜無料Webツール</title><meta name="description" content="仕事のタスクを重要度と緊急度で整理して、優先順位を確認できる無料ツール。個人事業やフリーランスの仕事整理に使えます。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:900px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.add{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}.add input,.add select{padding:9px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;width:100%}button{padding:9px 13px;border:0;border-radius:7px;background:#333;color:#fff;cursor:pointer}.item{display:grid;grid-template-columns:1fr 120px 120px 70px;gap:8px;padding:10px;border-bottom:1px solid #eee;align-items:center}.badge{padding:5px 8px;border-radius:5px;background:#eee;text-align:center}.high{font-weight:700}.rank{font-size:20px;font-weight:700}@media(max-width:650px){.add,.item{grid-template-columns:1fr}.item{border:1px solid #ddd;margin:7px 0;border-radius:7px}}</style></head><body><h1>仕事タスク優先順位メーカー</h1><p>タスクの重要度と緊急度を選ぶと、優先して取り組む順に並べ替えます。</p><div class="box"><div class="add"><input id="task" placeholder="例：見積もりを送る"><select id="importance"><option value="3">重要度：高</option><option value="2">重要度：中</option><option value="1">重要度：低</option></select><select id="urgency"><option value="3">緊急度：高</option><option value="2">緊急度：中</option><option value="1">緊急度：低</option></select><button onclick="add()">追加</button></div></div><div class="box"><div id="list"></div></div><script>let data=[];function add(){let t=task.value.trim();if(!t)return;data.push({t,i:+importance.value,u:+urgency.value});task.value='';render()}function del(i){data.splice(i,1);render()}function render(){data.sort((a,b)=>(b.i*b.u)-(a.i*a.u));list.innerHTML=data.map((x,i)=>'<div class="item"><div><span class="rank">'+(i+1)+'.</span> '+esc(x.t)+'</div><div class="badge">重要度：'+['','低','中','高'][x.i]+'</div><div class="badge">緊急度：'+['','低','中','高'][x.u]+'</div><button onclick="del('+i+')">削除</button></div>').join('')||'<p>タスクを追加してください。</p>'}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}task.addEventListener('keydown',e=>{if(e.key==='Enter')add()});render();</script></body></html>
