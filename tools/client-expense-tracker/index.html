<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案件経費記録メーカー｜無料Webツール</title><meta name="description" content="案件ごとの交通費、外注費、素材費などの経費を記録し、合計を確認できる無料ツール。CSV保存に対応しています。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:900px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px}input,select{box-sizing:border-box;width:100%;padding:8px;border:1px solid #ccc;border-radius:6px}button{padding:9px 14px;border:0;border-radius:7px;background:#333;color:#fff;margin:4px;cursor:pointer}.total{font-size:24px;font-weight:700;text-align:right}@media(max-width:650px){table{font-size:13px}}</style></head><body><h1>案件経費記録メーカー</h1><p>案件で発生した経費を記録して、合計金額を確認できます。入力内容は送信されません。</p><div class="box"><table><thead><tr><th>内容</th><th>区分</th><th>金額</th><th></th></tr></thead><tbody id="rows"></tbody></table><button onclick="addRow()">＋経費を追加</button></div><div class="box"><div class="total">経費合計：<span id="total">0</span> 円</div><button onclick="downloadCsv()">CSV保存</button></div><script>const rows=document.getElementById('rows');function addRow(){let tr=document.createElement('tr');tr.innerHTML='<td><input class="name" placeholder="例：画像素材"></td><td><select class="cat"><option>交通費</option><option>外注費</option><option>素材費</option><option>通信費</option><option>その他</option></select></td><td><input class="price" type="number" min="0" value="0"></td><td><button onclick="this.closest(\'tr\').remove();calc()">削除</button></td>';rows.appendChild(tr);tr.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc()}function calc(){let s=0;document.querySelectorAll('.price').forEach(x=>s+=+x.value||0);total.textContent=Math.round(s).toLocaleString()}function downloadCsv(){let a=[...rows.querySelectorAll('tr')].map(tr=>[tr.querySelector('.name').value,tr.querySelector('.cat').value,tr.querySelector('.price').value]);let csv='内容,区分,金額\n'+a.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');let link=document.createElement('a');link.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));link.download='案件経費.csv';link.click()}for(let i=0;i<5;i++)addRow();</script></body></html>
