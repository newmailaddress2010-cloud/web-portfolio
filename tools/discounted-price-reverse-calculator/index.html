<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>割引前価格逆算ツール｜無料Webツール</title><meta name="description" content="割引後の価格と割引率から割引前の価格を逆算できる無料Webツールです。値引き額も確認できます。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:680px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:600}input{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px}.result{font-size:20px;line-height:2}.big{font-size:30px;font-weight:700}button{padding:10px 15px;border:0;border-radius:7px;background:#333;color:#fff;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><h1>割引前価格逆算ツール</h1><p>割引後の価格から、割引前の価格と値引き額を逆算します。</p><div class="box"><div class="grid"><label>割引後価格（円）<input id="after" type="number" min="0" value="8000"></label><label>割引率（%）<input id="rate" type="number" min="0" max="99.99" step=".01" value="20"></label></div></div><div class="box"><div class="result">割引前価格：<span class="big" id="before"></span> 円<br>値引き額：<span id="discount"></span> 円</div><button onclick="copyResult()">結果をコピー</button></div><script>['after','rate'].forEach(id=>document.getElementById(id).addEventListener('input',calc));function calc(){let a=+after.value||0,r=+rate.value||0,b=r<100?a/(1-r/100):0;before.textContent=Math.round(b).toLocaleString();discount.textContent=Math.max(0,Math.round(b-a)).toLocaleString()}function copyResult(){navigator.clipboard.writeText('【割引前価格の逆算】\n割引後価格：'+(+after.value||0).toLocaleString()+'円\n割引率：'+(+rate.value||0)+'%\n割引前価格：'+before.textContent+'円\n値引き額：'+discount.textContent+'円');alert('結果をコピーしました。')}calc();</script></body></html>
