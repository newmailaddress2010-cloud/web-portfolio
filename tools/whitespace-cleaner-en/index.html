<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whitespace Cleaner</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:700px;margin:40px auto;padding:24px;background:#fff;border-radius:14px}textarea,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px}textarea{height:220px}button{background:#333;color:#fff;border:0;border-radius:8px}</style><div class="box"><h1>Whitespace Cleaner</h1><p>Remove unnecessary spaces and blank lines.</p><textarea id="i" placeholder="Paste text here"></textarea><button onclick="go()">Clean Text</button><textarea id="o"></textarea></div><script>function go(){o.value=i.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).join('\n')}</script>
