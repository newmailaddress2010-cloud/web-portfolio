<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Line Break Tool</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:700px;margin:40px auto;padding:24px;background:white;border-radius:14px}textarea,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px}textarea{height:220px}button{background:#333;color:#fff;border:0;border-radius:8px}</style><div class="box"><h1>Line Break Tool</h1><p>Convert text into one item per line.</p><textarea id="i" placeholder="Paste text here"></textarea><button onclick="go()">Convert</button><textarea id="o"></textarea></div><script>function go(){o.value=i.value.replace(/[、,;；]+/g,"\n").replace(/\s*\n\s*/g,"\n")}</script>
