<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scale Calculator</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px}label{display:block;margin-top:16px;font-weight:bold}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:6px}button{margin-top:20px;background:#333;color:white;border:0;border-radius:8px}</style><div class="box"><h1>Scale Calculator</h1><p>Calculate a real size from a drawing scale.</p><label>Drawing Size</label><input id="d" type="number"><label>Scale Denominator (e.g. 100 for 1:100)</label><input id="s" type="number" value="100"><button onclick="go()">Calculate Real Size</button><h2 id="r">—</h2></div><script>function go(){r.textContent=(+d.value*+s.value).toLocaleString()}</script>
