<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案件進捗ボードメーカー｜無料Webツール</title><meta name="description" content="小規模なWeb制作や個人案件のタスクを未着手・進行中・完了で管理できる無料ツール。ブラウザだけで使えます。"><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:900px;margin:auto;padding:20px;background:#f6f7f9;color:#222}.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.add{display:flex;gap:8px}.add input{flex:1;padding:10px;border:1px solid #ccc;border-radius:6px}button{padding:9px 13px;border:0;border-radius:7px;background:#333;color:#fff;cursor:pointer}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.col{background:#f1f2f4;border-radius:8px;padding:10px;min-height:150px}.card{background:#fff;border:1px solid #ddd;border-radius:7px;padding:10px;margin:7px 0}.card button{font-size:12px;margin:3px 2px;background:#666}.bar{margin:10px 0;font-weight:600}@media(max-width:650px){.cols{grid-template-columns:1fr}}</style></head><body><h1>案件進捗ボードメーカー</h1><p>案件の作業を「未着手・進行中・完了」に分けて管理できます。データはこのブラウザ内だけで処理します。</p><div class="box"><div class="add"><input id="task" placeholder="例：トップページの文章確認"><button onclick="add()">追加</button></div><div class="bar" id="bar"></div></div><div class="cols"><div class="col"><h2>未着手</h2><div id="todo"></div></div><div class="col"><h2>進行中</h2><div id="doing"></div></div><div class="col"><h2>完了</h2><div id="done"></div></div></div><script>let tasks=[];function add(){let v=task.value.trim();if(!v)return;tasks.push({t:v,s:0});task.value='';render()}function move(i,s){tasks[i].s=s;render()}function del(i){tasks.splice(i,1);render()}function render(){['todo','doing','done'].forEach(x=>document.getElementById(x).innerHTML='');tasks.forEach((x,i)=>{let b=document.createElement('div');b.className='card';b.innerHTML='<div>'+esc(x.t)+'</div><button onclick="move('+i+',0)">未着手</button><button onclick="move('+i+',1)">進行中</button><button onclick="move('+i+',2)">完了</button><button onclick="del('+i+')">削除</button>';document.getElementById(['todo','doing','done'][x.s]).appendChild(b)});let d=tasks.filter(x=>x.s===2).length;bar.textContent='進捗：'+d+' / '+tasks.length+' 件完了'+(tasks.length?'（'+Math.round(d/tasks.length*100)+'%）':'')}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}task.addEventListener('keydown',e=>{if(e.key==='Enter')add()});render();</script></body></html>
