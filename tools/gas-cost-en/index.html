<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gas Cost Calculator</title><style>body{font-family:Arial;background:#f5f6f8}.box{max-width:650px;margin:40px auto;padding:24px;background:#fff;border-radius:14px}label{display:block;font-weight:bold;margin-top:14px}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:6px}button{margin-top:18px;background:#222;color:#fff;border:0;border-radius:8px}.r{margin-top:20px;font-size:22px}</style><div class="box"><h1>Gas Cost Calculator</h1><p>Calculate fuel cost from distance, fuel economy, and gas price.</p><label>Distance (km)</label><input id="d" type="number"><label>Fuel Economy (km/L)</label><input id="e" type="number"><label>Gas Price (per L)</label><input id="p" type="number"><button onclick="go()">Calculate</button><div id="r" class="r"></div></div><script>function go(){let D=+d.value,E=+e.value,P=+p.value;if(!(D>0&&E>0&&P>0)){r.textContent='Please enter valid values.';return}let L=D/E,C=L*P;r.innerHTML='Fuel needed: '+L.toFixed(2)+' L<br><b>Gas cost: '+Math.round(C).toLocaleString()+'</b>'}</script>
