<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Duplicate Remover</title><style>body{font-family:Arial;background:#f5f5f5}.box{max-width:700px;margin:40px auto;padding:24px;background:white;border-radius:14px}textarea,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px}textarea{height:240px}button{background:#333;color:#fff;border:0;border-radius:8px}</style><div class="box"><h1>CSV Duplicate Row Remover</h1><p>Remove duplicate rows from CSV data.</p><textarea id="i" placeholder="Paste CSV here"></textarea><button onclick="go()">Remove Duplicates</button><textarea id="o" placeholder="Result"></textarea></div><script>function go(){let a=i.value.split(/\r?\n/).filter(Boolean),s=new Set(),r=[];for(const x of a){if(!s.has(x)){s.add(x);r.push(x)}}o.value=r.join("\n")}</script>
