<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discount Limit Calculator</title><style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:auto;padding:20px;background:#f6f7f9;color:#222;line-height:1.6}main{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 12px #0001}h1{font-size:24px;margin-top:0}.lead{color:#555}label{display:block;margin-top:16px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}button{margin-top:20px;padding:12px 18px;border:0;border-radius:8px;background:#333;color:#fff;font-size:16px}.result{margin-top:22px;padding:18px;background:#f0f3f6;border-radius:10px}.big{font-size:30px;font-weight:700}.warn{margin-top:12px;font-weight:600}.note{font-size:13px;color:#666;margin-top:16px}</style></head><body><main><h1>Discount Limit Calculator</h1><p class="lead">Find the maximum discount you can offer while keeping your target profit margin.</p>
<label>Regular price<input id="price" type="number" min="0" value="500"></label><label>Cost<input id="cost" type="number" min="0" value="200"></label><label>Minimum target profit margin (%)<input id="margin" type="number" min="0" max="99.9" step="0.1" value="30"></label><button onclick="calc()">Calculate</button><div id="result" class="result"></div><p class="note">Profit margin = (selling price − cost) ÷ selling price. Taxes, payment fees and fixed costs are not included.</p></main><script>function n(id){return Number(document.getElementById(id).value)||0}function money(x){return Math.round(x).toLocaleString("en-US")}function calc(){const p=n("price"),c=n("cost"),m=n("margin")/100,r=document.getElementById("result");if(p<=0||c<0||m>=1){r.textContent="Please check your inputs.";return}const min=c/(1-m),max=Math.max(0,p-min),rate=max/p*100,current=(p-c)/p*100;r.innerHTML="<div>Minimum price to keep your target margin</div><div class='big'>$"+money(min)+"</div><div>Maximum discount: $"+money(max)+"</div><div>Maximum discount rate: "+rate.toFixed(1)+"%</div><div>Current profit margin: "+current.toFixed(1)+"%</div>"+(p<min?"<div class='warn'>Your regular price is already below the target margin.</div>":"")}calc();</script></body></html>
