<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI計算ツール</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f5f7fb;color:#222}.wrap{max-width:680px;margin:auto;padding:24px 16px 50px}h1{text-align:center;font-size:28px;margin:8px 0}.lead{text-align:center;color:#666;margin:0 0 24px}.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 3px 14px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-weight:600;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #ccd2dc;border-radius:9px;font-size:16px}.unit{position:relative}.unit span{position:absolute;right:12px;top:12px;color:#777}.unit input{padding-right:45px}button{width:100%;border:0;border-radius:10px;padding:13px;font-size:17px;font-weight:700;cursor:pointer;background:#222;color:#fff;margin-top:18px}.main{text-align:center}.bmi{font-size:42px;font-weight:800;margin:4px}.status{font-size:18px;font-weight:700;margin-bottom:18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f5f7fb;border-radius:10px;padding:14px;text-align:center}.stat b{display:block;font-size:19px;margin-top:5px}.note{font-size:13px;color:#777;line-height:1.7}.error{color:#b00020;text-align:center;margin-top:10px}.links{text-align:center;font-size:13px;margin-top:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:24px}.bmi{font-size:36px}}</style></head><body><div class="wrap"><h1>BMI計算ツール</h1><p class="lead">身長と体重からBMIと標準体重の目安を計算します。</p><div class="card"><div class="grid"><div class="field"><label>身長</label><div class="unit"><input id="height" type="number" min="50" max="250" step="0.1" value="170"><span>cm</span></div></div><div class="field"><label>体重</label><div class="unit"><input id="weight" type="number" min="10" max="500" step="0.1" value="65"><span>kg</span></div></div></div><button id="calc">計算する</button><div id="error" class="error"></div></div><div id="result" class="card" style="display:none"><div class="main"><div>BMI</div><div class="bmi" id="bmi">—</div><div class="status" id="status">—</div></div><div class="stats"><div class="stat">標準体重の目安<b id="standard">—</b></div><div class="stat">標準体重との差<b id="diff">—</b></div></div></div><div class="card"><p class="note">BMI＝体重(kg)÷身長(m)²。判定は成人向けの一般的な基準を参考にしています。BMIは体脂肪量などを直接測定するものではないため、健康状態を判断する唯一の指標にはなりません。</p></div><div class="links"><a href="../../">Webツール一覧へ戻る</a></div></div><script>const $=id=>document.getElementById(id);function calc(){const h=+$("height").value/100,w=+$("weight").value;$("error").textContent="";if(!Number.isFinite(h)||!Number.isFinite(w)||h<=0||w<=0){$("error").textContent="入力内容を確認してください。";return}const bmi=w/(h*h),standard=22*h*h,diff=w-standard;let s=bmi<18.5?"低体重":bmi<25?"普通体重":bmi<30?"肥満（1度）":bmi<35?"肥満（2度）":bmi<40?"肥満（3度）":"肥満（4度）";$("bmi").textContent=bmi.toFixed(1);$("status").textContent=s;$("standard").textContent=standard.toFixed(1)+" kg";$("diff").textContent=(diff>=0?"+":"")+diff.toFixed(1)+" kg";$("result").style.display="block"}$("calc").onclick=calc;["height","weight"].forEach(id=>$(id).onchange=calc);calc();</script></body></html>
