<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>時給計算機</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#333}.box{max-width:520px;margin:50px auto;padding:28px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}h1{text-align:center;font-size:28px}label{display:block;margin:18px 0 8px;font-weight:bold}input,button{width:100%;padding:13px;font-size:16px;border:1px solid #ccc;border-radius:8px}button{margin-top:24px;background:#333;color:#fff;border:0;cursor:pointer}.result{margin-top:24px;padding:20px;background:#f7f7f7;border-radius:10px;text-align:center}.main{font-size:28px;font-weight:bold;margin-bottom:12px}.row{display:flex;justify-content:space-between;margin:9px 0}</style></head>
<body><div class="box"><h1>時給計算機</h1><label>時給（円）</label><input id="wage" type="number" min="0" placeholder="例：1300"><label>1日の勤務時間</label><input id="hours" type="number" min="0" step="0.25" placeholder="例：7.5"><label>月の勤務日数</label><input id="days" type="number" min="0" step="1" placeholder="例：20"><button onclick="calc()">計算する</button><div class="result"><div class="main" id="monthly">---</div><div class="row"><span>1日あたり</span><span id="daily">---</span></div><div class="row"><span>年間（12か月）</span><span id="yearly">---</span></div></div></div>
<script>function calc(){const w=Number(document.getElementById("wage").value),h=Number(document.getElementById("hours").value),d=Number(document.getElementById("days").value);if(!Number.isFinite(w)||w<0||!Number.isFinite(h)||h<0||!Number.isFinite(d)||d<0){alert("数字を正しく入力してください。");return}const daily=w*h,monthly=daily*d,yearly=monthly*12;document.getElementById("monthly").textContent=Math.round(monthly).toLocaleString()+"円／月";document.getElementById("daily").textContent=Math.round(daily).toLocaleString()+"円";document.getElementById("yearly").textContent=Math.round(yearly).toLocaleString()+"円"}</script></body></html>
